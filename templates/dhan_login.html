{% extends "base.html" %}
{% block title %}Dhan sign in | Kite Backfill{% endblock %}
{% block head %}
<style>
  .auth { min-height: 100vh; display: grid; grid-template-columns: 1.1fr minmax(0, 440px); gap: 56px; align-items: center;
          max-width: 1180px; margin: 0 auto; padding: 40px 24px; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 18px; letter-spacing: -.01em; margin-bottom: 48px; }
  .hero h1 { font-size: clamp(34px, 4.6vw, 54px); line-height: 1.05; letter-spacing: -.035em; font-weight: 800; margin: 0 0 18px; }
  .hero p { color: var(--muted); font-size: 17px; max-width: 46ch; margin: 0 0 28px; }
  .steps { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
  .step { display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 999px; font-size: 13px;
          background: rgba(148,163,184,.07); border: 1px solid var(--border); color: var(--muted); }
  .step i { font-style: normal; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
            background: rgba(124,131,255,.18); color: var(--text); font-weight: 700; font-size: 12px; }

  .card { padding: 36px; }
  .card h2 { margin: 0 0 6px; font-size: 26px; letter-spacing: -.02em; }
  .card .sub { color: var(--muted); margin: 0 0 26px; font-size: 14px; }
  .field { margin-bottom: 18px; }
  .secret { position: relative; }
  .secret .input { padding-right: 76px; }
  .secret button { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: rgba(148,163,184,.1);
                   border: 0; border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 700; cursor: pointer; color: var(--muted); }
  .secret button:hover { color: var(--text); }
  .error { display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; margin-bottom: 20px; font-size: 14px;
           background: rgba(255, 92, 122, .1); border: 1px solid rgba(255, 92, 122, .35); color: #FFB3C1; }
  .connected { padding: 14px 16px; border-radius: 12px; margin-bottom: 22px; font-size: 14px;
               background: rgba(46, 229, 157, .08); border: 1px solid rgba(46, 229, 157, .35); }
  .connected b { color: var(--green); }
  .connected dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 10px 0 12px; color: var(--muted); }
  .connected dd { margin: 0; color: var(--text); overflow-wrap: anywhere; }
  .redirect { margin-top: 26px; padding-top: 22px; border-top: 1px solid var(--border); }
  .redirect p { margin: 0 0 10px; font-size: 13px; color: var(--muted); }
  @media (max-width: 900px) {
    .auth { grid-template-columns: 1fr; gap: 28px; padding-top: 24px; }
    .brand { margin-bottom: 24px; }
    .card { padding: 26px 22px; }
  }
</style>
{% endblock %}
{% block body %}
<script id="boot" type="application/json">{{ {"error": error or "", "clientId": client_id or "", "hasToken": has_token,
  "dhan": dhan, "action": url_for("dhan.login"), "logout": url_for("dhan.logout"), "dashboard": dashboard, "tabs": {"zerodha": url_for("auth.index"), "dhan": url_for("dhan.index")}}|tojson }}</script>
<script>{% raw %}
(() => {
  const { useState } = React;
  const boot = JSON.parse(document.getElementById("boot").textContent);

  function DhanLogin() {
    const [show, setShow] = useState(false);
    const [busy, setBusy] = useState(false);
    const d = boot.dhan;
    return html`<main className="auth">
      <section className="hero">
        <div className="brand"><${Logo} /> Kite Backfill</div>
        <h1>Connect your<br/><span className="grad-text">Dhan account.</span></h1>
        <p>Paste the access token you generated on Dhan to save it next to your Kite session. Downloads still run on Kite for now.</p>
        <div className="steps">
          <span className="step"><i>1</i>Generate a token on web.dhan.co</span>
          <span className="step"><i>2</i>Paste it with your Client ID</span>
          <span className="step"><i>3</i>Checked and saved to .env</span>
        </div>
      </section>

      <form className="card panel" method="post" action=${boot.action} onSubmit=${() => setBusy(true)}>
        <${BrokerTabs} active="dhan" urls=${boot.tabs} />
        <h2>Sign in to Dhan</h2>
        <p className="sub">Use your Dhan Client ID and an access token from web.dhan.co. The token is checked with Dhan, then saved to <b>.env</b> in the project folder.</p>
        ${boot.error && html`<div className="error" role="alert">${boot.error}</div>`}
        ${d.connected && html`<div className="connected">
          <b>Connected</b>
          <dl><dt>Client ID</dt><dd>${d.client_id || "-"}</dd>
            <dt>Valid until</dt><dd>${d.expiry ? `${d.expiry} IST` : "unknown"}</dd>${d.data_plan && html`<dt>Data API</dt><dd>${d.data_plan}</dd>`}</dl>
          <a className="btn btn-primary btn-block" href=${boot.dashboard} style=${{ marginBottom: 8 }}>Open Dhan F&O →</a>
          <a className="btn btn-ghost btn-block" href=${boot.logout}>Disconnect</a></div>`}
        <div className="field">
          <label className="label" htmlFor="client_id">Client ID</label>
          <input className="input" id="client_id" name="client_id" defaultValue=${boot.clientId} required autoComplete="off" spellCheck="false" placeholder="Your Dhan Client ID" />
        </div>
        <div className="field">
          <label className="label" htmlFor="access_token">Access token</label>
          <div className="secret">
            <input className="input" id="access_token" name="access_token" type=${show ? "text" : "password"} autoComplete="off" spellCheck="false"
                   required=${!boot.hasToken} placeholder=${boot.hasToken ? "Saved. Leave blank to keep it" : "Paste your access token"} />
            <button type="button" onClick=${() => setShow(s => !s)} aria-controls="access_token">${show ? "Hide" : "Show"}</button>
          </div>
        </div>
        <button className="btn btn-primary btn-block" type="submit" disabled=${busy} style=${{ marginTop: 8 }}>
          ${busy ? html`<span className="spinner"></span> Checking token` : d.connected ? "Save and check again" : "Connect Dhan"}
        </button>
        <div className="redirect">
          <p>Generate the token on web.dhan.co under your profile's DhanHQ Trading APIs. Dhan tokens expire; paste a new one when the Connected box above is gone or the dashboard shows "Dhan: Not connected".</p>
        </div>
      </form>
    </main>`;
  }

  ReactDOM.createRoot(document.getElementById("root")).render(html`<${DhanLogin} />`);
})();
{% endraw %}</script>
{% endblock %}
