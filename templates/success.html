{% extends "base.html" %}
{% block title %}Kite Backfill{% endblock %}
{% block head %}
<style>
  .shell { max-width: 1280px; margin: 0 auto; padding: 0 24px 64px; }
  .nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 0 28px; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 18px; letter-spacing: -.01em; }
  .user { position: relative; }
  .user-btn { display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 6px; border-radius: 999px; cursor: pointer;
              background: rgba(148,163,184,.08); border: 1px solid var(--border); }
  .user-btn:hover { border-color: var(--border-2); }
  .avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px;
            background: var(--grad); color: #071021; }
  .user-btn small { color: var(--muted); font-size: 12px; }
  .menu { position: absolute; right: 0; top: calc(100% + 10px); width: 280px; padding: 16px; z-index: 20; }
  .menu dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0 0 14px; font-size: 13px; }
  .menu dt { color: var(--muted); }
  .menu dd { margin: 0; overflow-wrap: anywhere; }
  .menu p { color: var(--muted); font-size: 12px; margin: 0 0 14px; }
  .nav-actions { display: flex; align-items: center; gap: 10px; }
  .menu-dhan { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }

  .heading { margin: 0 0 24px; }
  .heading h1 { margin: 0 0 4px; font-size: clamp(28px, 3.4vw, 38px); letter-spacing: -.03em; font-weight: 800; line-height: 1.15; }
  .heading p { margin: 0; color: var(--muted); }

  .grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
  .card { padding: 26px; }
  .card + .card { margin-top: 24px; }
  .card-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 22px; }
  .card-title h2 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
  .card-title > span { color: var(--muted); font-size: 13px; }

  .section { margin-bottom: 22px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .segmented { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 14px; background: rgba(7,11,22,.55);
               border: 1px solid var(--border-2); position: relative; }
  .segmented button { position: relative; z-index: 1; border: 0; background: none; padding: 11px 12px; border-radius: 10px;
                      cursor: pointer; font-weight: 700; color: var(--muted); transition: color .2s; }
  .segmented button:disabled { cursor: not-allowed; }
  .segmented button small { display: block; font-weight: 500; font-size: 12px; color: var(--dim); }
  .segmented button[aria-pressed="true"] { color: #071021; }
  .segmented button[aria-pressed="true"] small { color: rgba(7,16,33,.65); }
  .segmented .thumb { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 10px;
                      background: var(--grad); transition: transform .3s cubic-bezier(.3,.8,.3,1); }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .chip { border: 1px solid var(--border-2); background: rgba(148,163,184,.06); border-radius: 999px; padding: 6px 12px;
          font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer; }
  .chip:hover:not(:disabled) { color: var(--text); border-color: var(--indigo); }
  .chip.on { color: var(--text); border-color: var(--indigo); background: rgba(124,131,255,.16); }
  .chip:disabled { opacity: .5; cursor: not-allowed; }

  .slider-head { display: flex; justify-content: space-between; align-items: baseline; }
  .slider-head b { font-size: 15px; }
  input[type=range] { width: 100%; appearance: none; -webkit-appearance: none; height: 6px; border-radius: 6px; margin: 14px 0 8px;
                      background: linear-gradient(90deg, var(--indigo), var(--cyan)) 0 / var(--fill, 50%) 100% no-repeat, rgba(148,163,184,.18); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #fff;
                      box-shadow: 0 0 0 5px rgba(124,131,255,.3); cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border: 0; border-radius: 50%; background: #fff;
                      box-shadow: 0 0 0 5px rgba(124,131,255,.3); cursor: pointer; }
  input[type=range]:disabled { opacity: .5; }
  .scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); }

  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0;
            border-top: 1px solid var(--border); cursor: pointer; }
  .toggle:last-child { border-bottom: 1px solid var(--border); }
  .toggle b { display: block; font-size: 14px; }
  .toggle small { color: var(--muted); font-size: 12px; }
  .switch { position: relative; flex: none; width: 44px; height: 26px; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .switch span { position: absolute; inset: 0; border-radius: 999px; background: rgba(148,163,184,.22); transition: background .2s; pointer-events: none; }
  .switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%;
                        background: #fff; transition: transform .25s cubic-bezier(.3,.8,.3,1); }
  .switch input:checked + span { background: var(--grad); }
  .switch input:checked + span::after { transform: translateX(18px); }
  .switch input:focus-visible + span { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .switch input:disabled + span { opacity: .5; }

  .picks { display: grid; gap: 6px; }
  .pick { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; cursor: pointer;
          background: rgba(148,163,184,.05); border: 1px solid var(--border); transition: border-color .2s, background .2s; }
  .pick:hover { border-color: var(--border-2); }
  .pick.on { border-color: rgba(124,131,255,.55); background: rgba(124,131,255,.1); }
  .pick input { width: 18px; height: 18px; margin: 0; flex: none; accent-color: var(--indigo); cursor: pointer; }
  .pick b { display: block; font-size: 14px; }
  .pick small { color: var(--muted); font-size: 12px; }
  .pick-group { color: var(--dim); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin: 10px 0 2px; }
  .sub-toggles { margin: 0 0 4px 30px; }
  .folder { display: flex; gap: 8px; }
  .folder .input { flex: 1; min-width: 0; }
  .hint { color: var(--dim); font-size: 12px; margin-top: 8px; }

  /* F&O date picker: one day, or a range with a second click */
  .drp-btn { display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left; cursor: pointer; }
  .drp-btn:disabled { cursor: default; }
  .drp-btn span.ph { color: var(--dim); }
  .drp-cal { margin-top: 8px; padding: 14px; border: 1px solid var(--border-2); border-radius: 12px; background: rgba(7, 11, 22, .55); }
  .drp-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-weight: 700; font-size: 14px; }
  .drp-nav { width: 30px; height: 30px; border: 1px solid var(--border-2); border-radius: 8px; background: none; color: var(--text);
             font: inherit; cursor: pointer; }
  .drp-nav:disabled { opacity: .3; cursor: default; }
  .drp-grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 2px; }
  .drp-wd { text-align: center; font-size: 11px; font-weight: 700; color: var(--dim); padding: 4px 0; }
  .drp-day { position: relative; height: 36px; border: 0; border-radius: 8px; background: none; color: var(--text);
             font: inherit; font-size: 13px; cursor: pointer; }
  .drp-day:hover:not(:disabled) { background: rgba(124, 131, 255, .2); }
  .drp-day:disabled { color: var(--dim); opacity: .45; cursor: default; }
  .drp-day.today { box-shadow: inset 0 0 0 1px var(--border-2); }
  .drp-day.in { background: rgba(124, 131, 255, .16); border-radius: 0; }
  .drp-day.edge, .drp-day.edge:hover:not(:disabled) { background: var(--indigo); color: #fff; font-weight: 700; border-radius: 8px; }
  .drp-day.miss::after, .drp-day.saved::after { content: ""; position: absolute; left: 50%; bottom: 4px; width: 4px; height: 4px;
             margin-left: -2px; border-radius: 50%; background: var(--amber); }
  .drp-day.saved::after { background: var(--green); }
  .drp-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .drp-foot i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin: 0 4px 1px 8px; vertical-align: middle; }
  .drp-link { border: 0; background: none; color: var(--cyan); font: inherit; font-size: 12px; cursor: pointer; padding: 4px 6px; }

  .estimate { border-radius: 16px; padding: 18px; background: linear-gradient(135deg, rgba(124,131,255,.12), rgba(56,217,245,.06));
              border: 1px solid rgba(124,131,255,.28); margin-bottom: 18px; }
  .est-nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
  .est-nums small { display: block; color: var(--muted); font-size: 12px; }
  .est-nums b { font-size: 22px; letter-spacing: -.02em; }
  .windows { display: flex; gap: 4px; height: 30px; }
  .win { flex: var(--d) 1 0; min-width: 0; border-radius: 6px; background: rgba(124,131,255,.18); font-size: 11px; font-weight: 700;
         color: var(--muted); padding: 7px 6px; white-space: nowrap; overflow: hidden; transition: background .3s, color .3s; }
  .win.now { background: var(--grad); color: #071021; box-shadow: 0 0 20px rgba(56,217,245,.45); }
  .win-ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); margin-top: 6px; }
  .est-note { font-size: 13px; color: var(--muted); margin: 12px 0 0; }
  .problem { display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; margin-bottom: 16px; font-size: 14px;
             background: rgba(255, 92, 122, .1); border: 1px solid rgba(255, 92, 122, .35); color: #FFB3C1; }
  .actions { display: flex; gap: 12px; }
  .actions .btn-primary { flex: 1; }

  /* Live panel */
  .badge { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 800; }
  .badge i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .badge.running { color: var(--green); background: rgba(46,229,157,.12); }
  .badge.running i { animation: pulse 1.6s ease-out infinite; }
  .badge.stopped { color: var(--amber); background: rgba(255,181,71,.12); }
  .badge.finished { color: var(--green); background: rgba(46,229,157,.12); }
  .badge.idle { color: var(--muted); background: rgba(148,163,184,.12); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(46,229,157,.6); } 100% { box-shadow: 0 0 0 10px rgba(46,229,157,0); } }

  .live-top { display: grid; grid-template-columns: 200px 1fr; gap: 24px; align-items: center; margin-bottom: 22px; }
  .ring { position: relative; width: 200px; height: 200px; }
  .ring svg { transform: rotate(-90deg); display: block; }
  .ring circle { transition: stroke-dashoffset .8s cubic-bezier(.3,.8,.3,1); }
  .ring-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring-center b { font-size: 40px; letter-spacing: -.04em; line-height: 1; }
  .ring-center b sup { font-size: 18px; color: var(--muted); }
  .ring-center small { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .now-label { color: var(--muted); font-size: 12px; font-weight: 600; }
  .ticker { font-size: 28px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; overflow-wrap: anywhere; }
  .ticker.flash { animation: flash .5s ease-out; }
  @keyframes flash { from { color: var(--cyan); transform: translateY(-3px); } }
  .now-sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .eta { display: inline-flex; gap: 8px; align-items: baseline; padding: 8px 12px; border-radius: 10px; background: rgba(148,163,184,.08); }
  .eta b { font-size: 16px; }
  .eta small { color: var(--muted); font-size: 12px; }

  .spark { border-radius: 14px; padding: 14px 16px 10px; background: rgba(7,11,22,.45); border: 1px solid var(--border); margin-bottom: 18px; }
  .spark-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .spark-head b { color: var(--text); font-size: 14px; }
  .spark svg { display: block; width: 100%; height: 64px; margin-top: 6px; }

  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
  .tile { padding: 12px 14px; border-radius: 14px; background: rgba(148,163,184,.06); border: 1px solid var(--border); }
  .tile small { display: block; color: var(--muted); font-size: 12px; }
  .tile b { font-size: 19px; letter-spacing: -.01em; }
  .tile.bad { border-color: rgba(255,92,122,.4); background: rgba(255,92,122,.08); }
  .tile.bad b { color: var(--red); }
  .tile.warn b { color: var(--amber); }
  .message { padding: 12px 14px; border-radius: 12px; font-size: 14px; background: rgba(148,163,184,.08); border: 1px solid var(--border); margin-bottom: 18px; }
  .message.warn { background: rgba(255,181,71,.08); border-color: rgba(255,181,71,.35); color: #FFD59A; }
  .filter { color: var(--dim); font-size: 12px; margin: 0; }
  .details { margin: 0 0 14px; font-size: 13px; }
  .details div { display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding: 8px 0; border-top: 1px solid var(--border); }
  .details div:last-child { border-bottom: 1px solid var(--border); }
  .details dt { color: var(--muted); }
  .details dd { margin: 0; overflow-wrap: anywhere; }

  .feed { list-style: none; margin: 0; padding: 0 6px 0 0; max-height: 420px; overflow-y: auto; }
  .feed li { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid var(--border); font-size: 14px; }
  .feed li:first-child { border-top: 0; animation: toast-in .35s ease-out; }
  .feed .tick { color: var(--green); margin-right: 10px; }
  .feed small { color: var(--dim); font-size: 12px; }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 18px 0 6px; display: grid; place-items: center; }

  /* F&O daily card and summary */
  .lead { color: var(--muted); font-size: 14px; margin: -8px 0 18px; }
  .path { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--muted); overflow-wrap: anywhere;
          padding: 10px 12px; border-radius: 10px; background: rgba(7,11,22,.45); border: 1px solid var(--border); margin-top: 8px; }
  .sum { margin: 0 0 14px; }
  .sum-title { color: var(--muted); font-size: 12px; font-weight: 700; margin: 0 0 8px; }
  .table-wrap { overflow: auto; max-height: 320px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 14px; }
  .sum table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .sum th, .sum td { padding: 7px 10px; text-align: left; white-space: nowrap; border-top: 1px solid var(--border); }
  .sum th { position: sticky; top: 0; border-top: 0; background: #0E1426; color: var(--muted); font-size: 12px; font-weight: 700; }
  .sum .num { text-align: right; font-variant-numeric: tabular-nums; }

  /* Bhavcopy check card and banners */
  .full-row { margin-top: 24px; }   /* the Bhavcopy check card spans both columns */
  .bhav-days table { min-width: 100%; }
  .bhav-days tbody tr { cursor: pointer; }
  .bhav-days tr.day-ok td { background: rgba(46,229,157,.07); }
  .bhav-days tr.day-diffs td { background: rgba(255,92,122,.09); }
  .bhav-days tr.day-minor td { background: rgba(255,181,71,.08); }
  .bhav-days tr.day-pending td { background: rgba(148,163,184,.05); color: var(--muted); cursor: default; }
  .bhav-days tr.open td { box-shadow: inset 0 1px 0 var(--indigo), inset 0 -1px 0 var(--indigo); }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; }
  .pill.ok { color: var(--green); background: rgba(46,229,157,.14); }
  .pill.diffs { color: var(--red); background: rgba(255,92,122,.14); }
  .pill.minor { color: var(--amber); background: rgba(255,181,71,.14); }
  .sum-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 0 0 8px; }
  .sum-head .sum-title { margin: 0; }
  .sum-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .dl-menu { position: relative; }
  .dl-list { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; min-width: 250px; padding: 6px;
    background: var(--bg-2); border: 1px solid var(--border-2); border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,.45); }
  .dl-list button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--text);
    font: inherit; font-size: 13px; padding: 9px 12px; border-radius: 8px; cursor: pointer; }
  .dl-list button:hover, .dl-list button:focus-visible { background: rgba(148,163,184,.12); outline: none; }
  .sum-head select { background: rgba(7,11,22,.55); color: var(--text); border: 1px solid var(--border-2); border-radius: 10px;
                     padding: 6px 10px; font: inherit; font-size: 13px; }
  .btn-sm { padding: 5px 12px; font-size: 12px; min-height: 0; }
  .status-cell { white-space: normal; min-width: 110px; font-size: 12px; }
  .sum th.wrap { white-space: normal; min-width: 90px; }
  .banner { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
            padding: 12px 16px; border-radius: 14px; margin: -8px 0 18px; font-size: 14px; }
  .banner.bad { background: rgba(255,92,122,.1); border: 1px solid rgba(255,92,122,.4); color: #FFB3C1; }
  .banner.warn, .banner.minor { background: rgba(255,181,71,.08); border: 1px solid rgba(255,181,71,.35); color: #FFD59A; }
  .banner .btn { padding: 7px 14px; }

  @media (max-width: 1060px) { .grid { grid-template-columns: minmax(0, 1fr); } }   /* wide tables scroll inside their card */
  @media (max-width: 560px) {
    .shell { padding: 0 16px 48px; }
    .card { padding: 20px 18px; }
    .row2 { grid-template-columns: 1fr; }
    .live-top { grid-template-columns: 1fr; justify-items: center; text-align: center; }
    .tiles { grid-template-columns: repeat(2, 1fr); }
    .est-nums b { font-size: 18px; }
    .user-btn .name { display: none; }
    .user-btn { padding: 4px; }
    .folder { flex-direction: column; }
  }
</style>
{% endblock %}
{% block body %}
<script id="boot" type="application/json">{{ {
  "mode": mode, "broker": broker, "kite": kite,
  "user": user, "form": form, "index_choices": index_choices, "today": today, "fno": fno, "dhan": dhan, "dhan_connected": dhan_connected, "error": error or "",
  "urls": {"start": url_for("dashboard.download_start"), "fno": url_for("dashboard.download_fno_start"), "fnoWindow": url_for("dashboard.download_fno_window"),
           "bhavStatus": url_for("dashboard.fno_bhav_status"), "bhavDiff": url_for("dashboard.fno_bhav_diff"), "bhavExport": url_for("dashboard.fno_bhav_export"),
           "bhavCheck": url_for("dashboard.fno_bhav_check"), "redownload": url_for("dashboard.fno_redownload"),
           "stop": url_for("dashboard.download_stop"), "status": url_for("dashboard.download_status"),
           "browse": url_for("dashboard.browse_folder"), "logout": url_for("auth.logout"), "dhan": url_for("dhan.index"),
           "dhanLogout": url_for("dhan.logout", next="dashboard"), "dhanPageLogout": url_for("dhan.logout"),
           "dhanDashboard": url_for("dhan.dashboard"), "success": url_for("dashboard.success")}
}|tojson }}</script>
<script>{% raw %}
(() => {
  const { useState, useEffect, useRef, useMemo, useCallback } = React;
  const boot = JSON.parse(document.getElementById("boot").textContent);
  const U = boot.urls;
  const B = boot.broker;                 // F&O card data source: Kite (/success) or Dhan (/dhan/dashboard)
  const DHAN = boot.mode === "dhan";
  // Bhavcopy routes read Kite's folder, or the Dhan folder with source=dhan. Q.underlying follows the
  // F&O card's NIFTY | SENSEX switch (App sets it before rendering the cards)
  const Q = { underlying: boot.fno.underlying, ...(DHAN ? { source: "dhan" } : {}) };
  const UNDERLYINGS = boot.fno.underlyings || [{ name: boot.fno.underlying, exchange: boot.fno.exchange, bhav: "NSE" }];
  const exchOf = u => (UNDERLYINGS.find(x => x.name === u) || UNDERLYINGS[0]).bhav;   // whose bhavcopy: NSE or BSE
  // example file names on the F&O card: a future and a weekly option in the underlying's strike range
  const EXAMPLE = { NIFTY: ["27OCT26", "2500013OCT26CE"], SENSEX: ["29OCT26", "7470015OCT26CE"] };
  // The check's files and lines say "Kite" for "the saved files"; on the Dhan page they are Dhan's
  const brand = t => DHAN && typeof t === "string" ? t.replaceAll("Kite", "Dhan").replaceAll("KITE", "DHAN") : t;
  const WINDOW_DAYS = { minute: 60, day: 2000 };
  const TYPICAL_STOCKS = 2150;
  const MAX_DAYS_EQUITY = 365, MAX_DAYS_INDEX = 7305;   // MAX_RANGE_DAYS / MAX_INDEX_RANGE_DAYS in backfill/fetch.py
  const SINCE_2015 = "2015-01-01";
  const FULL_PATH = /^([a-zA-Z]:[\\/]|\\\\|\/|~)/;

  const nf = new Intl.NumberFormat("en-IN");
  const n = v => nf.format(Math.round(Number(v) || 0));
  const parse = s => { const d = new Date(s + "T00:00:00"); return isNaN(d) ? null : d; };
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const short = d => d.toLocaleDateString("en-IN", { day: "numeric", month: "short" });
  const long = d => d ? d.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }) : "";
  const dur = s => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.round(s % 3600 / 60);
                     return h ? `${h}h ${String(m).padStart(2, "0")}m` : `${Math.max(m, 1)} min`; };
  const addDays = (d, k) => { const x = new Date(d); x.setDate(x.getDate() + k); return x; };

  // Same windows as make_chunks() in backfill/fetch.py
  function windows(from, to, interval) {
    const out = [], step = WINDOW_DAYS[interval] || 60;
    for (let cur = new Date(from); cur <= to;) {
      const end = addDays(cur, step - 1), last = end < to ? end : new Date(to);
      out.push({ from: new Date(cur), days: Math.round((last - cur) / 864e5) + 1 });
      cur = addDays(last, 1);
    }
    return out;
  }

  // Same checks as download_start() in dashboard.py
  function problem(f) {
    const from = parse(f.from), to = parse(f.to), speed = Number(f.speed);
    if (!from || !to) return "Enter a start and end date.";
    if (to > parse(boot.today)) return "The end date can't be in the future.";
    if (from >= to) return "The start date must be before the end date.";
    if (!f.equity && !f.indices.length) return "Tick at least one thing to download.";
    const days = Math.round((to - from) / 864e5);
    if (f.equity && days > MAX_DAYS_EQUITY) return "With NSE equity stocks ticked, the range can be one year at most. Untick equity to download indices over a longer range, or split the period into separate downloads.";
    if (days > MAX_DAYS_INDEX) return "Indices can be downloaded for up to 20 years per run.";
    if (!(speed > 0 && speed <= 3)) return "Set a speed between 0.1 and 3 requests a second.";
    if (!FULL_PATH.test(f.folder.trim())) return "Enter the folder as a full path, for example D:\\market_data.";
    return "";
  }

  const PRESETS = [["30 days", 30], ["3 months", 91], ["6 months", 182], ["1 year", 364]];

  function Planner({ job, toast, onPoll, folder, setFolder }) {
    const [f, setF] = useState({ ...boot.form, speed: Number(boot.form.speed) });
    const [busy, setBusy] = useState("");
    const set = (k, v) => setF(x => ({ ...x, [k]: v }));
    const running = !!job && job.state === "running";
    const err = problem({ ...f, folder });
    const from = parse(f.from), to = parse(f.to);
    const ws = useMemo(() => err ? [] : windows(from, to, f.interval), [f.from, f.to, f.interval, err]);
    const stocks = (job && job.equity_total) || TYPICAL_STOCKS;
    const count = (f.equity ? stocks : 0) + f.indices.length;
    const total = count * ws.length;
    // job_run_key() / run_key() in backfill/storage.py: indices first, then equity
    const base = `${f.interval}:${f.from}:${f.to}${f.format === "parquet" ? "" : ":" + f.format}`;
    const runKey = [...(f.indices.length ? [base + ":idx"] : []), ...(f.equity ? [base] : [])].join(" + ");
    const sameRun = !!job && job.run === runKey && !!job.folder && job.equity === f.equity &&
                    (job.indices || []).join() === f.indices.join() &&
                    job.folder.toLowerCase() === folder.trim().toLowerCase() && job.chunks_total > 0;
    const left = sameRun ? job.chunks_total - job.chunks_done : total;
    const resumable = !running && sameRun && job.chunks_done > 0 && left > 0;
    const preset = PRESETS.find(([, d]) => f.to === boot.today && f.from === iso(addDays(parse(boot.today), -d)));
    const since2015 = f.to === boot.today && f.from === SINCE_2015;
    const now = new Date(), stamp = `${iso(now)}_${String(now.getHours()).padStart(2, "0")}${String(now.getMinutes()).padStart(2, "0")}`;   // run_dir_name() in backfill/storage.py
    const pickIndex = (sym, on) => setF(x => ({ ...x, indices: boot.index_choices.filter(s => s === sym ? on : x.indices.includes(s)) }));

    const start = async () => {
      setBusy("start");
      const body = new FormData();
      Object.entries({ interval: f.interval, from: f.from, to: f.to, speed: f.speed, folder, format: f.format }).forEach(([k, v]) => body.append(k, v));
      if (f.equity) body.append("equity", "1");
      f.indices.forEach(s => body.append("indices", s));
      if (f.etfs) body.append("etfs", "1");
      if (f.t2t) body.append("t2t", "1");
      try {
        const r = await fetch(U.start, { method: "POST", body });
        const u = new URL(r.url);
        if (u.pathname !== U.success) { location.href = r.url; return; }   // session ended: back to sign-in
        const e = u.searchParams.get("error");
        e ? toast(e, "err") : toast(resumable ? "Download resumed" : "Download started", "ok");
      } catch (e) { toast("Couldn't reach the app. Check that python app.py is running.", "err"); }
      setBusy(""); onPoll();
    };

    const browse = async () => {
      setBusy("browse");
      try {
        const j = await (await fetch(U.browse, { method: "POST", body: new URLSearchParams({ current: folder }) })).json();
        if (j.path) setFolder(j.path);
        if (j.error) toast(j.error, "err");
      } catch (e) { toast("Couldn't open the folder window. Type the path instead.", "err"); }
      setBusy("");
    };

    const speedPct = (f.speed - .5) / 2.5 * 100;
    return html`<section className="card panel" aria-labelledby="plan-title">
      <div className="card-title"><h2 id="plan-title">New download</h2><span>${[f.equity && "NSE equity", f.indices.length && `${f.indices.length} ${f.indices.length === 1 ? "index" : "indices"}`].filter(Boolean).join(" + ") || "Nothing selected"}</span></div>

      <div className="section">
        <span className="label">Stocks</span>
        <div className="picks" role="group" aria-label="Stocks">
          <label className=${"pick" + (f.equity ? " on" : "")}>
            <input type="checkbox" checked=${f.equity} disabled=${running} onChange=${e => set("equity", e.target.checked)} />
            <span><b>NSE equity stocks</b><small>About ${n(TYPICAL_STOCKS)} stocks, one year per run at most</small></span>
          </label>
          ${f.equity && html`<div className="sub-toggles">
            <label className="toggle">
              <span><b>Trade-to-trade stocks</b><small>Include the -BE and -BZ series</small></span>
              <span className="switch"><input type="checkbox" checked=${f.t2t} disabled=${running} onChange=${e => set("t2t", e.target.checked)} /><span></span></span>
            </label>
            <label className="toggle">
              <span><b>ETFs</b><small>Index, gold and other ETFs listed on NSE</small></span>
              <span className="switch"><input type="checkbox" checked=${f.etfs} disabled=${running} onChange=${e => set("etfs", e.target.checked)} /><span></span></span>
            </label>
          </div>`}
          <div className="pick-group">NSE indices (spot)</div>
          ${boot.index_choices.map(sym => html`<label key=${sym} className=${"pick" + (f.indices.includes(sym) ? " on" : "")}>
            <input type="checkbox" checked=${f.indices.includes(sym)} disabled=${running} onChange=${e => pickIndex(sym, e.target.checked)} />
            <span><b>${sym === "NIFTY 50" ? "NIFTY 50 spot" : sym}</b></span>
          </label>`)}
        </div>
      </div>

      <div className="section">
        <span className="label">Candle size</span>
        <div className="segmented" role="group" aria-label="Candle size">
          <span className="thumb" style=${{ transform: f.interval === "day" ? "translateX(100%)" : "none" }}></span>
          <button type="button" aria-pressed=${f.interval === "minute"} disabled=${running} onClick=${() => set("interval", "minute")}>
            1 minute${f.equity && html`<small>7 requests per stock a year</small>`}</button>
          <button type="button" aria-pressed=${f.interval === "day"} disabled=${running} onClick=${() => set("interval", "day")}>
            Daily (EOD)${f.equity && html`<small>1 request per stock</small>`}</button>
        </div>
      </div>

      <div className="section">
        <div className="row2">
          <div><label className="label" htmlFor="from">From</label>
            <input className="input" id="from" type="date" max=${boot.today} value=${f.from} disabled=${running} onChange=${e => set("from", e.target.value)} /></div>
          <div><label className="label" htmlFor="to">To</label>
            <input className="input" id="to" type="date" max=${boot.today} value=${f.to} disabled=${running} onChange=${e => set("to", e.target.value)} /></div>
        </div>
        <div className="chips">
          ${PRESETS.map(([label, d]) => html`<button key=${label} type="button" disabled=${running}
              className=${"chip" + (preset && preset[1] === d ? " on" : "")}
              onClick=${() => setF(x => ({ ...x, to: boot.today, from: iso(addDays(parse(boot.today), -d)) }))}>Last ${label}</button>`)}
          <button type="button" disabled=${running || f.equity} title=${f.equity ? "Untick NSE equity stocks to use a range longer than a year" : ""}
              className=${"chip" + (since2015 ? " on" : "")}
              onClick=${() => setF(x => ({ ...x, to: boot.today, from: SINCE_2015 }))}>Since 2015</button>
        </div>
      </div>

      <div className="section">
        <div className="slider-head"><label className="label" htmlFor="speed" style=${{ margin: 0 }}>Speed</label>
          <b>${f.speed.toFixed(1)} requests/s</b></div>
        <input id="speed" type="range" min="0.5" max="3" step="0.1" value=${f.speed} disabled=${running}
               style=${{ "--fill": speedPct + "%" }} onChange=${e => set("speed", Number(e.target.value))} />
        <div className="scale"><span>0.5, gentle</span><span>3, Kite's limit</span></div>
      </div>

      <div className="section">
        <label className="label" htmlFor="folder">Save to</label>
        <div className="folder">
          <input className="input" id="folder" value=${folder} disabled=${running} spellCheck="false" onChange=${e => setFolder(e.target.value)} />
          <button type="button" className="btn btn-ghost" disabled=${running || busy === "browse"} onClick=${browse}>
            ${busy === "browse" ? html`<span className="spinner"></span> Opening` : "Browse"}</button>
        </div>
        <div className="hint">Each download gets its own folder named after what, candle size, dates and start time, e.g.
          ${" "}<code>${f.equity ? "Equity_stocks" : "Index_spot"}_${f.interval === "day" ? "EOD" : "1min"}_${f.from}_to_${f.to}_started_${stamp}</code>
          ${" "}/ SYMBOL / year.${f.format}. Index names use _ for spaces (NIFTY_50). Resume keeps writing into the original folder. The folder window may open behind the browser.</div>
      </div>

      <div className="section">
        <span className="label">File format</span>
        <div className="segmented" role="group" aria-label="File format">
          <span className="thumb" style=${{ transform: f.format === "parquet" ? "translateX(100%)" : "none" }}></span>
          <button type="button" aria-pressed=${f.format === "csv"} disabled=${running} onClick=${() => set("format", "csv")}>
            CSV<small>Opens in Excel, larger files</small></button>
          <button type="button" aria-pressed=${f.format === "parquet"} disabled=${running} onClick=${() => set("format", "parquet")}>
            Parquet<small>Compact, for pandas and Python</small></button>
        </div>
      </div>

      ${err ? html`<div className="problem" role="alert">${err}</div>` : html`<div className="estimate">
        <div className="est-nums">
          <div><small>${f.equity ? "Instruments" : f.indices.length === 1 ? "Index" : "Indices"}</small><b>${f.equity && !(job && job.equity_total) ? "~" : ""}${n(count)}</b></div>
          <div><small>${sameRun ? "Requests left" : "Requests"}</small><b>${n(left)}</b></div>
          <div><small>Time at full speed</small><b>${left ? dur(left / f.speed) : "Done"}</b></div>
        </div>
        <div className="windows" aria-hidden="true">
          ${ws.map(w => html`<div key=${iso(w.from)} style=${{ "--d": w.days }}
              className=${"win" + (running && job.chunk === iso(w.from) ? " now" : "")}>${w.days >= 15 ? short(w.from) : ""}</div>`)}
        </div>
        <div className="win-ends"><span>${long(from)}</span><span>${long(to)}</span></div>
        <p className="est-note">${ws.length === 1 ? `One request per ${f.equity ? "stock" : "index"} covers the whole range.`
          : `Kite allows ${f.interval === "day" ? "2,000 days of daily" : "60 days of 1-minute"} candles per request, so each ${f.equity ? "stock and index" : "index"} takes ${ws.length} requests.`}${f.equity && f.indices.length ? " Indices are fetched first, then stocks." : ""}${resumable
          ? ` ${n(job.chunks_done)} chunks are already saved in this folder and will be skipped.` : ""}</p>
      </div>`}

      <div className="actions">
        <button type="button" className="btn btn-primary" disabled=${!!err || running || busy === "start"} onClick=${start}>
          ${busy === "start" ? html`<span className="spinner"></span> Starting` : running ? "Download running" : resumable ? "Resume download" : "Start download"}
        </button>
      </div>
    </section>`;
  }

  // Date and minutes since midnight in IST, whatever the browser's time zone (today_ist() in backfill/fno.py)
  function istNow() {
    const p = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Kolkata", year: "numeric", month: "2-digit", day: "2-digit",
                                                 hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date());
    const g = t => p.find(x => x.type === t).value;
    return { date: `${g("year")}-${g("month")}-${g("day")}`, mins: Number(g("hour")) * 60 + Number(g("minute")) };
  }

  const weekdayDate = s => `${parse(s).toLocaleDateString("en-IN", { weekday: "short" })} ${long(parse(s))}`;
  const dayCount = (a, b) => Math.round((parse(b) - parse(a)) / 864e5) + 1;

  // Date picker of the F&O card: click a day for that day, click a second day to make it a range.
  // value {from, to} (ISO; from === to is one day, "" none). Days outside [min, max] can't be picked;
  // missing days get an amber dot, saved ones a green dot.
  function DayRangePicker({ id, value, onChange, min, max, today, disabled, missing, saved }) {
    const [open, setOpen] = useState(false);
    const [anchor, setAnchor] = useState("");    // first click, waiting for the second one of a range
    const [hover, setHover] = useState("");
    const [month, setMonth] = useState("");      // "YYYY-MM" shown
    const ref = useRef(null);
    useEffect(() => {
      if (!open) { setAnchor(""); setHover(""); return; }
      setMonth((value.to || max || today).slice(0, 7));
      const close = e => { if (e.type === "keydown" ? e.key === "Escape" : !ref.current?.contains(e.target)) setOpen(false); };
      document.addEventListener("mousedown", close); document.addEventListener("keydown", close);
      return () => { document.removeEventListener("mousedown", close); document.removeEventListener("keydown", close); };
    }, [open]);
    useEffect(() => { if (disabled) setOpen(false); }, [disabled]);

    const pick = d => {
      if (anchor && d !== anchor) {
        onChange(d < anchor ? { from: d, to: anchor } : { from: anchor, to: d });
        setOpen(false);
      } else if (anchor) {
        setOpen(false);                          // the same day twice: just that day
      } else {
        onChange({ from: d, to: d }); setAnchor(d);
      }
    };
    const [lo, hi] = anchor ? (hover && hover !== anchor ? [anchor, hover].sort() : [anchor, anchor]) : [value.from, value.to];

    const first = month ? parse(month + "-01") : null;
    const cells = [];
    if (first) {
      for (let k = 0; k < (first.getDay() + 6) % 7; k++) cells.push(null);   // weeks start on Monday
      for (let d = first; d.getMonth() === first.getMonth(); d = addDays(d, 1)) cells.push(iso(d));
    }
    const shift = k => { const d = parse(month + "-01"); d.setMonth(d.getMonth() + k); setMonth(iso(d).slice(0, 7)); };
    const label = !value.from ? html`<span className="ph">Choose a day, or a range</span>`
      : value.from === value.to ? weekdayDate(value.from)
      : `${short(parse(value.from))} – ${long(parse(value.to))} · ${dayCount(value.from, value.to)} days`;

    return html`<div ref=${ref}>
      <button type="button" id=${id} className="input drp-btn" disabled=${disabled} aria-expanded=${open} onClick=${() => setOpen(!open)}>
        <span>${label}</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
      </button>
      ${open && first && html`<div className="drp-cal" onMouseLeave=${() => setHover("")}>
        <div className="drp-head">
          <button type="button" className="drp-nav" aria-label="Previous month" disabled=${!!min && month <= min.slice(0, 7)} onClick=${() => shift(-1)}>‹</button>
          <span>${first.toLocaleDateString("en-IN", { month: "long", year: "numeric" })}</span>
          <button type="button" className="drp-nav" aria-label="Next month" disabled=${month >= max.slice(0, 7)} onClick=${() => shift(1)}>›</button>
        </div>
        <div className="drp-grid">
          ${["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"].map(w => html`<div key=${w} className="drp-wd">${w}</div>`)}
          ${cells.map((d, k) => !d ? html`<span key=${"b" + k}></span>` : html`<button type="button" key=${d}
              className=${["drp-day", d === today && "today", lo && d > lo && d < hi && "in", (d === lo || d === hi) && "edge",
                           missing.includes(d) ? "miss" : saved.includes(d) && "saved"].filter(Boolean).join(" ")}
              disabled=${(!!min && d < min) || d > max} title=${missing.includes(d) ? "Not saved yet" : saved.includes(d) ? "Saved" : ""}
              onMouseEnter=${() => setHover(d)} onClick=${() => pick(d)}>${Number(d.slice(8))}</button>`)}
        </div>
        <div className="drp-foot">
          <span>${anchor ? "Click another day for a range, or the same day again for just this day."
            : html`<i style=${{ background: "var(--amber)" }}></i>not saved<i style=${{ background: "var(--green)" }}></i>saved`}</span>
          <span style=${{ whiteSpace: "nowrap" }}>
            ${value.from && html`<button type="button" className="drp-link" onClick=${() => { onChange({ from: "", to: "" }); setAnchor(""); }}>Clear</button>`}
            <button type="button" className="drp-link" onClick=${() => setOpen(false)}>Done</button></span>
        </div>
      </div>`}
    </div>`;
  }

  function FnoCard({ job, toast, onPoll, folder, setFolder, days, onBhav, keepZero, setKeepZero, trimBhav, setTrimBhav, und, setUnd }) {
    const F = { ...boot.fno, underlying: und };
    const X = exchOf(und);                                  // NSE or BSE: the bhavcopy this underlying is checked with
    const ex = EXAMPLE[und] || EXAMPLE.NIFTY;
    const [speed, setSpeed] = useState(Number(boot.form.speed));
    const [busy, setBusy] = useState("");
    const [sel, setSel] = useState({ from: "", to: "" });   // no default: the date is always picked by hand
    const isRange = !!sel.from && sel.from !== sel.to;
    const runDate = isRange ? "" : sel.from;                 // the one picked day, "" for none or a range
    const span = isRange ? `${short(parse(sel.from))} – ${long(parse(sel.to))}` : "";
    const nDays = isRange ? dayCount(sel.from, sel.to) : 1;
    const [win, setWin] = useState(null);          // /download/fno-window: allowed dates and missing days
    const [winErr, setWinErr] = useState("");
    const [now, setNow] = useState(istNow);
    useEffect(() => { const t = setInterval(() => setNow(istNow()), 20000); return () => clearInterval(t); }, []);
    const running = !!job && job.state === "running";
    const folderOk = FULL_PATH.test(folder.trim());

    // Reload the window when the folder or the underlying changes (its expiry history) and after each job
    useEffect(() => { setWin(null); setWinErr(""); setSel({ from: "", to: "" }); }, [und]);
    const loadWindow = useCallback(async () => {
      if (!FULL_PATH.test(folder.trim())) return;
      try {
        const j = await (await fetch(`${B.urls.fnoWindow}?${new URLSearchParams({ folder, underlying: F.underlying })}`, { cache: "no-store" })).json();
        if (j.error) { setWinErr(j.error); setWin(null); } else { setWin(j); setWinErr(""); }
      } catch (e) { setWinErr("Couldn't reach the app. Check that python app.py is running."); }
    }, [folder, und]);
    useEffect(() => { const t = setTimeout(loadWindow, 600); return () => clearTimeout(t); }, [loadWindow]);
    useEffect(() => { if (job && !running) loadWindow(); }, [running]);

    // Bhavcopy check of the picked date, from the day list App loads (/fno/bhav-status)
    const bhavInfo = runDate && folderOk ? (days.find(d => d.date === runDate) || null) : null;
    // a range checks its saved days one after another
    const bhavDays = !folderOk ? [] : isRange ? days.map(d => d.date).filter(d => d >= sel.from && d <= sel.to).sort()
      : runDate && runDate <= now.date ? [runDate] : [];
    const checkBhav = async () => {
      setBusy("bhav");
      for (const d of bhavDays) await bhavCheck({ folder, date: d }, toast);
      onBhav(); onPoll();
      setBusy("");
    };

    // window_error() and too_early() in backfill/fno.py
    const [rh, rm] = F.ready_at.split(":").map(Number);
    const early = sel.to === now.date && now.mins < rh * 60 + rm;
    const outside = !!win && !!sel.from && (sel.from < win.min_date || sel.to > win.max_date);
    const doneBefore = !!win && !!runDate && !outside && !win.missing.includes(runDate) && runDate !== now.date;
    const note = !folderOk ? "Enter the save folder as a full path, or click Browse."
      : !win ? (winErr || `Loading the allowed dates from ${B.name}...`)
      : !sel.from ? "Choose the date to download, or click a second day for a range."
      : outside ? (sel.to > win.max_date ? "That date is in the future."
          : `Earliest date available is ${long(parse(win.min_date))}. Contracts that expired on ${long(parse(win.previous_expiry))} are no longer served by ${B.name}.`)
      : early ? `Candles for today can be downloaded after ${F.ready_at} IST.` : "";
    const missing = win ? win.missing : [];
    const saved = !!runDate && folderOk && days.some(d => d.date === runDate);   // the day has a summary.csv

    // which: "date", "missing" or "refetch" (every contract of the saved day without a file, keep zero-volume ON)
    const start = async which => {
      setBusy(which);
      const body = new URLSearchParams({ underlying: F.underlying, speed, folder, keep_zero: keepZero ? "1" : "0",
                                         trim_bhav: trimBhav ? "1" : "0" });
      if (which === "missing") body.append("missing", "1");
      else if (isRange) { body.append("date_from", sel.from); body.append("date_to", sel.to); }
      else body.append("date", runDate);
      if (which === "refetch") body.append("refetch", "1");
      try {
        const r = await fetch(B.urls.fno, { method: "POST", body });
        const u = new URL(r.url);
        if (u.pathname !== B.urls.page) { location.href = r.url; return; }
        const e = u.searchParams.get("error");
        e ? toast(e, "err") : toast(which === "missing" ? `Downloading ${missing.length} missing ${missing.length === 1 ? "day" : "days"}`
          : which === "refetch" ? `Re-checking no-trade contracts for ${long(parse(runDate))}`
          : isRange ? `${F.underlying} F&O download for ${span} (${nDays} days) started`
          : `${F.underlying} F&O download for ${long(parse(runDate))} started`, "ok");
      } catch (e) { toast("Couldn't reach the app. Check that python app.py is running.", "err"); }
      setBusy(""); onPoll();
    };

    const browse = async () => {
      setBusy("browse");
      try {
        const j = await (await fetch(U.browse, { method: "POST", body: new URLSearchParams({ current: folder }) })).json();
        if (j.path) setFolder(j.path);
        if (j.error) toast(j.error, "err");
      } catch (e) { toast("Couldn't open the folder window. Type the path instead.", "err"); }
      setBusy("");
    };

    const speedPct = (speed - .5) / (B.maxSpeed - .5) * 100;
    const cli = (und === "NIFTY" ? "" : ` --underlying ${und}`) + (DHAN ? " --source dhan" : "");
    return html`<section className="card panel" aria-labelledby="fno-title">
      <div className="card-title"><h2 id="fno-title">${F.underlying} F&O daily</h2><span>Today ${long(parse(now.date))} (IST)</span></div>
      <p className="lead">1-minute candles with open interest for every ${F.underlying} future and option that traded on the day in the Accelpix file layout.${" "}
        ${B.name} drops contracts once they expire, so only the days since the last expiry can still be downloaded in full.</p>
      ${UNDERLYINGS.length > 1 && html`<div className="section">
        <span className="label">Index</span>
        <div className="segmented" role="group" aria-label="Index">
          <span className="thumb" style=${{ transform: und === UNDERLYINGS[1].name ? "translateX(100%)" : "none" }}></span>
          ${UNDERLYINGS.slice(0, 2).map(u => html`<button key=${u.name} type="button" aria-pressed=${und === u.name} disabled=${running || !!busy}
              onClick=${() => setUnd(u.name)}>${u.name}<small>${u.bhav} bhavcopy · ${B.name} ${u.exchange}</small></button>`)}
        </div>
      </div>`}

      <dl className="details">
        <div><dt>Candles</dt><dd>09:00 to 16:00 IST, every row ${B.name} returns. Contracts without candles get no file; see the switch below for zero-volume ones.</dd></div>
        ${DHAN && html`<div><dt>Folder</dt><dd><code>${`${F.underlying}_FnO_1min_Dhan/<date>_exp-<expiry>_<withZeroVol|noZeroVol>_dl-<date>_<HHMM>/`}</code>, separate from the Kite files</dd></div>`}
        ${!DHAN && html`<div><dt>Folder</dt><dd><code>${`${F.underlying}_FnO_1min/<date>_exp-<expiry>_<withZeroVol|noZeroVol>_dl-<date>_<HHMM>/`}</code></dd></div>`}
        <div><dt>Contracts</dt><dd>${trimBhav
          ? `Only those in ${X}'s bhavcopy for the day (traded or not) once it is published, usually in the evening; before that, all of ${B.name}'s list.`
          : `All of ${B.name}'s list, including strikes and expiries added after the day.`}</dd></div>
        <div><dt>Files</dt><dd><code>futures/${F.underlying}${ex[0]}.csv</code>, <code>options/${F.underlying}${ex[1]}.csv</code>, plus summary.csv and run.log</dd></div>
        <div><dt>Bhavcopy</dt><dd>After each day, ${X}'s F&O bhavcopy and the check go into <code>${"<day folder>/bhavcopy/"}</code>: bhav_compare.csv,
          bhav_summary.csv and checked_days_summary.csv.${" "}
          ${X} publishes it in the evening; until then the day stays pending (Check below).</dd></div>
        ${win && html`<div><dt>Week expiry</dt><dd>${weekdayDate(win.current_expiry)}</dd></div>`}
        ${win && win.days && html`<div><dt>Saved days</dt><dd>${win.days.count
          ? `${n(win.days.count)} (${long(parse(win.days.first))} to ${long(parse(win.days.last))}; ${n(win.days.with)} with zero volume, ${n(win.days.no)} without${win.days.old ? `, ${n(win.days.old)} old-style` : ""})`
          : "None yet"}</dd></div>`}
      </dl>

      ${win && win.today_is_expiry && html`<div className="message warn">Today is expiry. Run after ${F.ready_at} or this contract's data is lost.</div>`}

      <div className="section">
        <label className="label" htmlFor="fno-date">Date or range</label>
        <${DayRangePicker} id="fno-date" value=${sel} onChange=${setSel} min=${win ? win.min_date : ""} max=${win ? win.max_date : now.date}
               today=${now.date} disabled=${running || !win} missing=${missing} saved=${folderOk ? days.map(d => d.date) : []} />
        <div className="hint">${win ? [`Available: ${long(parse(win.min_date))} to today (${B.name} drops contracts after expiry).`,
            win.estimated ? "The start is estimated from the weekly expiry day until a run has saved the expiry history." : "",
            "Click one day, or a second day for a range. Weekends and holidays are detected and skipped; saved contracts are skipped."]
            .filter(Boolean).join(" ") : "Pick the trading day, or a range of days, to download."}</div>
      </div>

      <div className="section">
        <label className="label" htmlFor="fno-folder">Save to</label>
        <div className="folder">
          <input className="input" id="fno-folder" value=${folder} disabled=${running} spellCheck="false" onChange=${e => setFolder(e.target.value)} />
          <button type="button" className="btn btn-ghost" disabled=${running || busy === "browse"} onClick=${browse}>
            ${busy === "browse" ? html`<span className="spinner"></span> Opening` : "Browse"}</button>
        </div>
        <div className="hint">${DHAN ? "" : "Separate from New download. "}Running a day again skips contracts that are already saved. The folder window may open behind the browser.</div>
      </div>

      <div className="section">
        <div className="slider-head"><label className="label" htmlFor="fno-speed" style=${{ margin: 0 }}>Speed</label>
          <b>${speed.toFixed(1)} requests/s</b></div>
        <input id="fno-speed" type="range" min="0.5" max=${B.maxSpeed} step="0.1" value=${speed} disabled=${running}
               style=${{ "--fill": speedPct + "%" }} onChange=${e => setSpeed(Number(e.target.value))} />
        <div className="scale"><span>0.5, gentle</span><span>${B.maxSpeed}, ${B.name}'s limit</span></div>
      </div>

      <div className="section">
        <label className="toggle">
          <span><b>Keep contracts with candles but zero volume</b>
            <small>${`${B.name} can report a single trade as volume 0. ON keeps these files; the bhavcopy check marks any that ${X} says did not trade as EXTRA.`}</small></span>
          <span className="switch"><input type="checkbox" checked=${keepZero} disabled=${running} onChange=${e => setKeepZero(e.target.checked)} /><span></span></span>
        </label>
        <label className="toggle">
          <span><b>Download only contracts in the bhavcopy</b>
            <small>${`ON requests only the contracts in ${X}'s bhavcopy for the day, traded or not, so strikes listed later are not requested. Until ${X} publishes it (usually in the evening) the full list is used and run.log says why.`}</small></span>
          <span className="switch"><input type="checkbox" checked=${trimBhav} disabled=${running} onChange=${e => setTrimBhav(e.target.checked)} /><span></span></span>
        </label>
      </div>

      ${note && html`<div className="message">${note}</div>`}
      <div className="actions">
        <button type="button" className="btn btn-primary" disabled=${!!note || running || !!busy} onClick=${() => start("date")}>
          ${busy === "date" ? html`<span className="spinner"></span> Starting` : running ? "Download running"
            : isRange ? `Download F&O for ${span} (${nDays} days)`
            : doneBefore ? "Download again (skips saved files)" : runDate ? `Download F&O for ${long(parse(runDate))}` : "Download F&O"}
        </button>
      </div>
      ${win && html`<div className="actions" style=${{ marginTop: 10 }}>
        <button type="button" className="btn btn-ghost btn-block" disabled=${!missing.length || running || !!busy || !folderOk} onClick=${() => start("missing")}>
          ${busy === "missing" ? html`<span className="spinner"></span> Starting` : missing.length
            ? `Download all missing days (${missing.length}): ${missing.map(d => short(parse(d))).join(", ")}` : "No missing days"}
        </button>
      </div>`}
      ${saved && html`<div className="actions" style=${{ marginTop: 10 }}>
        <button type="button" className="btn btn-ghost btn-block" disabled=${!keepZero || !!note || running || !!busy}
                title=${keepZero ? "Request every contract of this day that has no file again; contracts with a file are skipped. The bhavcopy check runs again if it is saved."
                                 : "Turn on Keep contracts with candles but zero volume first"} onClick=${() => start("refetch")}>
          ${busy === "refetch" ? html`<span className="spinner"></span> Starting` : `Re-check no-trade contracts for ${long(parse(runDate))}`}</button>
      </div>`}
      <div className="actions" style=${{ marginTop: 10 }}>
        <button type="button" className="btn btn-ghost btn-block" disabled=${!bhavDays.length || running || !!busy}
                title=${isRange ? `Compare each saved day of the range with its ${X} F&O bhavcopy`
                  : `Download the ${X} F&O bhavcopy for this date and compare every ${F.underlying} contract with the saved files`} onClick=${checkBhav}>
          ${busy === "bhav" ? html`<span className="spinner"></span> Checking against ${X}`
            : isRange ? (bhavDays.length ? `Check vs ${X} bhavcopy (${bhavDays.length} saved ${bhavDays.length === 1 ? "day" : "days"})` : `Check vs ${X} bhavcopy (no saved days in range)`)
            : `Check vs ${X} bhavcopy`}</button>
      </div>
      ${bhavInfo && html`<div className=${"message" + (bhavInfo.status === "diffs" ? " warn" : "")} style=${{ margin: "10px 0 0" }}>
        ${brand(bhavInfo.line)}${bhavInfo.checked_at ? html`<small style=${{ color: "var(--dim)", display: "block" }}>Checked ${bhavInfo.checked_at}; details in bhavcopy/bhav_compare.csv</small>` : ""}</div>`}
      ${html`<p className="hint">From a terminal: <code>python nifty_daily.py YYYY-MM-DD${cli}</code>, <code>python nifty_daily.py --missing${cli}</code>, <code>python nifty_daily.py --refetch-no-trade YYYY-MM-DD${cli}</code>, <code>python nifty_bhav.py YYYY-MM-DD${cli}</code></p>`}
    </section>`;
  }

  // POST /fno/bhav-check (date or missing) and toast each day's result; returns the results
  async function bhavCheck(params, toast) {
    try {
      const j = await (await fetch(U.bhavCheck, { method: "POST", body: new URLSearchParams({ ...Q, ...params }) })).json();
      if (j.error) { toast(j.error, "err"); return []; }
      if (!j.results.length) toast(j.message || "Nothing to check.", "info");
      j.results.forEach(r => toast(`${short(parse(r.date))}: ${r.status === "not_available" ? "bhavcopy not published yet" : r.line}`,
                                   r.status === "ok" ? "ok" : r.status === "not_available" ? "info" : "err"));
      return j.results;
    } catch (e) { toast("Couldn't reach the app. Check that python app.py is running.", "err"); return []; }
  }

  const BHAV_LABEL = { ok: "OK", diffs: "CHECK", pending: "pending" };

  // "Download" button with a small menu; each item is [label, /fno/bhav-export params]. The file is fetched
  // first, so a day without a check shows a toast instead of an error page.
  function DownloadMenu({ items, folder, disabled, toast }) {
    const [open, setOpen] = useState(false);
    const [busy, setBusy] = useState(false);
    const ref = useRef(null);
    useEffect(() => {
      if (!open) return;
      const close = e => { if (e.type === "keydown" ? e.key === "Escape" : !ref.current?.contains(e.target)) setOpen(false); };
      document.addEventListener("mousedown", close); document.addEventListener("keydown", close);
      return () => { document.removeEventListener("mousedown", close); document.removeEventListener("keydown", close); };
    }, [open]);
    const get = async params => {
      setOpen(false); setBusy(true);
      try {
        const r = await fetch(`${U.bhavExport}?${new URLSearchParams({ folder, ...Q, ...params })}`, { cache: "no-store" });
        if (!r.ok) {
          let msg = "Download failed.";
          try { msg = (await r.json()).error || msg; } catch (e) {}
          toast(msg, "err");
        } else {
          const name = (/filename="?([^";]+)"?/.exec(r.headers.get("Content-Disposition") || "") || [])[1] || "bhavcopy_check";
          const url = URL.createObjectURL(await r.blob());
          const a = Object.assign(document.createElement("a"), { href: url, download: name });
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 2000);
          toast(`Saved ${name} to your downloads`, "ok");
        }
      } catch (e) { toast("Couldn't reach the app. Check that python app.py is running.", "err"); }
      setBusy(false);
    };
    return html`<div className="dl-menu" ref=${ref}>
      <button type="button" className="btn btn-ghost btn-sm" aria-haspopup="menu" aria-expanded=${open} disabled=${disabled || busy}
              onClick=${() => setOpen(o => !o)}>${busy ? html`<span className="spinner"></span> Preparing` : "Download ▾"}</button>
      ${open && html`<div className="dl-list" role="menu">
        ${items.map(([label, params]) => html`<button key=${label} type="button" role="menuitem" onClick=${() => get(params)}>${label}</button>`)}</div>`}
    </div>`;
  }

  // One row per saved Kite day with its bhavcopy check (backfill/bhav.py list_days); click to see differences
  function BhavCard({ job, toast, onPoll, folder, days, onBhav, openDay, setOpenDay, checkAll, checkingAll, keepZero, und }) {
    const [busy, setBusy] = useState("");
    const [diff, setDiff] = useState(null);          // { date, rows, units, line } or { date, error }
    const running = !!job && job.state === "running";
    const pending = days.filter(d => d.status === "pending").length;
    const c = (d, k) => d.status === "pending" ? "" : n((d.counts || {})[k]);
    const q = v => v === "" || v == null ? "-" : n(v);   // volumes and OI; prices are shown as saved
    // red: missing contracts or volume diffs where Kite has volume; amber: known Kite limitations (backfill/bhav.py severity)
    const sev = d => d.status === "diffs" && d.severity === "minor" ? "minor" : d.status;
    const liquid = d => d.status !== "diffs" || !("liquid_missing" in (d.counts || {})) ? (d.status === "diffs" ? "not grouped (older check)" : "—")
      : `${n(d.counts.liquid_missing)} missing, ${n(d.counts.liquid_diffs)} diffs`;
    const [bucket, setBucket] = useState("all");
    useEffect(() => setBucket("all"), [openDay]);
    const bhavCli = (und === "NIFTY" ? "" : ` --underlying ${und}`) + (DHAN ? " --source dhan" : "");

    const loadDiff = useCallback(async date => {
      if (!date) { setDiff(null); return; }
      try {
        const j = await (await fetch(`${U.bhavDiff}?${new URLSearchParams({ folder, date, ...Q })}`, { cache: "no-store" })).json();
        setDiff({ date, ...j });
      } catch (e) { setDiff({ date, error: "Couldn't reach the app." }); }
    }, [folder, und]);
    useEffect(() => { loadDiff(openDay); }, [openDay, loadDiff, days]);

    const checkNow = async date => {
      setBusy(date);
      await bhavCheck({ folder, date }, toast);
      await onBhav(); onPoll();
      setBusy("");
    };
    const redownload = async (date, contract) => {
      setBusy(contract);
      try {
        const j = await (await fetch(U.redownload, { method: "POST", body: new URLSearchParams({ folder, date, contract, ...Q, keep_zero: keepZero ? "1" : "0" }) })).json();
        if (j.error) toast(j.error, "err");
        else toast(j.saved ? `${j.message} ${j.line}` : j.message, j.saved ? (j.status === "ok" ? "ok" : "info") : "err");
        await onBhav(); onPoll();
      } catch (e) { toast("Couldn't reach the app. Check that python app.py is running.", "err"); }
      setBusy("");
    };

    return html`<section className="card panel" aria-labelledby="bhav-title">
      <div className="card-title"><h2 id="bhav-title">${UNDERLYINGS.length > 1 ? `${und} bhavcopy check` : "Bhavcopy check"}</h2><span>${days.length ? `${n(days.length)} saved ${days.length === 1 ? "day" : "days"}` : ""}</span></div>
      <p className="lead">Each saved ${und} F&O day compared with ${exchOf(und)}'s official end-of-day file: contracts missing or extra, and volume, OI and last-price differences.</p>
      ${!FULL_PATH.test(folder.trim()) ? html`<div className="message">Choose the save folder on the F&O card above.</div>`
        : !days.length ? html`<div className="empty">No saved F&O days in this folder yet.</div>` : html`
      <div className="actions" style=${{ marginBottom: 14 }}>
        <button type="button" className="btn btn-ghost btn-block" disabled=${!pending || running || checkingAll || !!busy} onClick=${checkAll}>
          ${checkingAll ? html`<span className="spinner"></span> Checking all pending` : pending ? `Check all pending (${pending})` : "No days pending"}</button>
      </div>
      <div className="sum-head">
        <div className="sum-title">Checked days</div>
        <${DownloadMenu} folder=${folder} toast=${toast} disabled=${pending === days.length}
          items=${[["All days summary (CSV)", { scope: "days" }]]} />
      </div>
      <div className="table-wrap sum bhav-days"><table>
        <thead><tr><th>Date</th><th>Expiry</th><th title="Keep contracts with candles but zero volume">Zero vol</th><th>Downloaded</th><th>Status</th><th title="Current week, next week, current month and next month">Liquid buckets</th><th className="num">Bhav traded</th><th className="num">${brand("Kite files")}</th><th className="num">Missing</th>
          <th className="num">Extra</th><th className="num">Volume diffs</th><th className="num">OI diffs</th><th className="num">Price diffs</th></tr></thead>
        <tbody>${days.map(d => html`<tr key=${d.date} className=${"day-" + sev(d) + (openDay === d.date ? " open" : "")}
              onClick=${() => d.status !== "pending" && setOpenDay(openDay === d.date ? "" : d.date)}
              title=${brand(d.status === "pending" ? d.line : `${d.line}. Click to see the differences.`)}>
          <td title=${d.folder || ""}>${long(parse(d.date))}</td>
          <td>${d.expiry ? long(parse(d.expiry)) : ""}</td><td>${{ with: "With", no: "No" }[d.zero_volume] || ""}</td><td>${d.downloaded || ""}</td>
          <td>${d.status === "pending"
            ? html`<button type="button" className="btn btn-ghost btn-sm" disabled=${running || checkingAll || !!busy} onClick=${e => { e.stopPropagation(); checkNow(d.date); }}>
                ${busy === d.date ? html`<span className="spinner"></span>` : "Check now"}</button>`
            : html`<span className=${"pill " + sev(d)} title=${sev(d) === "minor" ? brand("No missing contracts or volume differences; only known Kite limitations (zero-volume, extra files, OI, price)") : ""}>
                ${sev(d) === "minor" ? "CHECK (minor)" : BHAV_LABEL[d.status]}</span>`}</td>
          <td>${liquid(d)}</td>
          <td className="num">${c(d, "bhav_traded")}</td><td className="num">${c(d, "kite_files")}</td><td className="num">${c(d, "missing")}</td>
          <td className="num">${c(d, "extra")}</td><td className="num">${c(d, "volume_diffs")}${(d.counts || {}).zero_volume ? html`<small style=${{ display: "block", color: "var(--dim)" }}>${n(d.counts.zero_volume)} zero-volume</small>` : ""}</td><td className="num">${c(d, "oi_diffs")}</td>
          <td className="num">${c(d, "price_diffs")}</td></tr>`)}</tbody>
      </table></div>`}

      ${diff && openDay && (() => {
        const all = diff.rows || [];
        const buckets = [...new Set(all.map(r => r.Bucket))];
        const shown = all.filter(r => bucket === "all" || (bucket === "liquid" ? r.Liquid : r.Bucket === bucket));
        return html`<div className="sum">
        <div className="sum-head">
          <div className="sum-title">${long(parse(diff.date))}: ${brand(diff.error || diff.line)}${all.length ? ` (${shown.length === all.length ? n(all.length) : `${n(shown.length)} of ${n(all.length)}`} contracts not OK, biggest bhavcopy volume first)` : ""}</div>
          <div className="sum-tools">
          ${all.length > 0 && html`<select aria-label="Filter by bucket" value=${bucket} onChange=${e => setBucket(e.target.value)}>
            <option value="all">All buckets</option><option value="liquid">Liquid buckets</option>
            ${buckets.filter(b => b !== "Far").map(b => html`<option key=${b} value=${b}>${b}</option>`)}
            ${buckets.includes("Far") && html`<option value="Far">Far</option>`}</select>`}
          ${!diff.error && html`<${DownloadMenu} folder=${folder} toast=${toast} items=${[
            ["This view (CSV)", { date: diff.date, scope: "view", bucket }],
            ["All contracts for this day (CSV)", { date: diff.date, scope: "all" }],
            ["Full report (Excel)", { date: diff.date, scope: "xlsx" }]]} />`}
          </div>
        </div>
        ${diff.rows && (all.length === 0 ? html`<div className="empty">No differences.</div>` : !shown.length ? html`<div className="empty">No differences in this bucket.</div>` : html`<div className="table-wrap"><table>
          <thead><tr><th>Contract</th><th>Expiry</th><th>Bucket</th><th>Type</th><th className="num">Strike</th>
            <th className="num" title=${`Bhavcopy volume in shares (contracts x ${(diff.units || {}).volume || 1})`}>${brand("Volume, bhav / Kite")}</th>
            <th className="num">${brand("OI, bhav / Kite")}</th><th className="num wrap" title=${brand("Kite's last bar of the day; regular close = last candle starting before 15:30")}>${brand("Last, bhav / Kite (regular close)")}</th>
            <th className="wrap">${brand("Kite last bar")}</th><th>Status</th><th></th></tr></thead>
          <tbody>${shown.map(r => html`<tr key=${r.Contract}>
            <td>${r.Contract}</td><td>${r.Expiry ? short(parse(r.Expiry)) : ""}</td>
            <td style=${r.Liquid ? null : { color: "var(--dim)" }}>${r.Bucket}</td><td>${r.Type}</td><td className="num">${r.Strike}</td>
            <td className="num">${q(r.Bhav_volume_shares)} / ${q(r.Kite_volume)}</td>
            <td className="num">${q(r.Bhav_OI)} / ${q(r.Kite_OI)}</td>
            <td className="num">${r.Bhav_last || "-"} / ${r.Kite_last || r.Kite_last_any || "-"}${(r.Kite_last_regular || r.Kite_last_1530) ? ` (${r.Kite_last_regular || r.Kite_last_1530})` : ""}</td>
            <td>${(r.Last_bar || "").slice(0, 5)}</td>
            <td className="status-cell">${brand(r.Status).replaceAll("_", " ").replaceAll("+", ", ")}${r.Note ? html`<small style=${{ display: "block", color: "var(--dim)" }}>${brand(r.Note)}</small>` : ""}</td>
            <td>${r.Status.includes("MISSING_IN_KITE") && (r.Live
              ? html`<button type="button" className="btn btn-ghost btn-sm" disabled=${running || !!busy} onClick=${() => redownload(diff.date, r.Contract)}>
                  ${busy === r.Contract ? html`<span className="spinner"></span>` : "Re-download"}</button>`
              : html`<small style=${{ color: "var(--dim)" }}>expired</small>`)}</td></tr>`)}</tbody>
        </table></div>`)}
      </div>`; })()}
      <p className="hint">Each download checks its day once the bhavcopy is published; check pending days here, or with${" "}
        <code>python nifty_bhav.py YYYY-MM-DD${bhavCli}</code> / <code>--missing${bhavCli}</code>.</p>
    </section>`;
  }

  function Ring({ pct, state, failed }) {
    const r = 86, c = 2 * Math.PI * r;
    const color = pct >= 100 ? "url(#ok)" : state !== "running" && failed ? "#FFB547" : "url(#ring)";
    return html`<div className="ring" role="progressbar" aria-valuenow=${pct.toFixed(1)} aria-valuemin="0" aria-valuemax="100" aria-label="Chunks downloaded">
      <svg width="200" height="200" viewBox="0 0 200 200">
        <defs>
          <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="#7C83FF"/><stop offset="1" stopColor="#38D9F5"/></linearGradient>
          <linearGradient id="ok" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="#2EE59D"/><stop offset="1" stopColor="#38D9F5"/></linearGradient>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <circle cx="100" cy="100" r=${r} fill="none" stroke="rgba(148,163,184,.14)" strokeWidth="12"/>
        ${pct > 0 && html`<circle cx="100" cy="100" r=${r} fill="none" stroke=${color} strokeWidth="12" strokeLinecap="round"
                strokeDasharray=${c} strokeDashoffset=${c * (1 - Math.min(pct, 100) / 100)} filter="url(#glow)"/>`}
      </svg>
      <div className="ring-center"><b>${Math.floor(pct)}<sup>.${Math.floor(pct % 1 * 10)}%</sup></b><small>downloaded</small></div>
    </div>`;
  }

  function Spark({ points }) {
    const W = 300, H = 64, max = Math.max(3, ...points);
    if (points.length < 2) return html`<svg viewBox=${`0 0 ${W} ${H}`} preserveAspectRatio="none"><line x1="0" x2=${W} y1=${H - 2} y2=${H - 2} stroke="rgba(148,163,184,.25)" strokeDasharray="4 4"/></svg>`;
    const xy = points.map((p, i) => [i / (points.length - 1) * W, H - 4 - p / max * (H - 10)]);
    const d = xy.map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
    return html`<svg viewBox=${`0 0 ${W} ${H}`} preserveAspectRatio="none">
      <defs><linearGradient id="sp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor="#38D9F5" stopOpacity=".35"/><stop offset="1" stopColor="#38D9F5" stopOpacity="0"/></linearGradient></defs>
      <path d=${`${d} L${W},${H} L0,${H} Z`} fill="url(#sp)"/>
      <path d=${d} fill="none" stroke="#38D9F5" strokeWidth="2" vectorEffect="non-scaling-stroke"/></svg>`;
  }

  function Live({ job, rates, toast, onPoll }) {
    const [stopping, setStopping] = useState(false);
    if (!job) return html`<section className="card panel"><div className="empty"><span className="spinner"></span></div></section>`;

    const running = job.state === "running";
    const isFno = job.kind === "fno";
    const pct = job.chunks_total ? job.chunks_done / job.chunks_total * 100 : 0;
    const badge = { running: "Downloading", stopped: "Stopped", finished: "Finished", idle: "Idle" }[job.state] || job.state;
    const what = { minute: "1-minute", day: "Daily" }[job.interval] || "";
    const stop = async () => {
      setStopping(true);
      try { await fetch(U.stop, { method: "POST" }); toast("Stopping after the current request", "info"); } catch (e) {}
      for (let i = 0; i < 30; i++) { const j = await onPoll(); if (!j || j.state !== "running") break; await new Promise(r => setTimeout(r, 700)); }
      setStopping(false);
    };
    const tiles = [
      [isFno ? "Contracts done" : job.equity ? "Instruments done" : "Indices done", job.stocks_total ? `${n(job.stocks_done)} / ${n(job.stocks_total)}` : "None yet"],
      isFno ? ["Files written", n(job.completed_count)] : ["Chunks", job.chunks_total ? `${n(job.chunks_done)} / ${n(job.chunks_total)}` : "None yet"],
      ["Requests", n(job.requests)],
      ["Speed now", `${Number(job.rate || 0).toFixed(2)} req/s`, running && job.rate < job.speed ? "warn" : ""],
      ["Rate-limit hits", n(job.n429), job.n429 > 0 ? "warn" : ""],
      ["Network errors", n(job.net_errors), job.net_errors > 0 ? "warn" : ""],
      [isFno ? "Failed contracts" : "Failed chunks", n(job.failed), job.failed > 0 ? "bad" : ""],
      [isFno ? "No candles, no file" : "Empty chunks", n(job.empty)],
      ...(isFno ? [["Zero-volume candles", n((job.zero_kept || 0) + (job.zero_skipped || 0)), "",
                    `kept ${n(job.zero_kept || 0)} / skipped ${n(job.zero_skipped || 0)}`]]   // eta shows by the ring
        : [["Time left", running && job.eta ? job.eta : "None"]]),
    ];
    const fnoRun = isFno ? `${job.fno_underlying} F&O 1-minute candles with OI, ${long(parse(job.fno_date))}` : "";
    const details = job.run ? [
      ["Run", isFno ? fnoRun : `${what} candles, ${long(parse(job.from))} to ${long(parse(job.to))}`],
      ...(isFno ? [["Data from", job.source === "dhan" ? "Dhan" : "Kite"]] : []),
      ["Selection", isFno ? `All live ${job.fno_underlying} futures and options (${job.fno_exchange})`
        : [...(job.indices || []), ...(job.equity ? ["NSE equity stocks"] : [])].join(", ")],
      ["Saving to", (job.out_dirs || []).length ? html`${job.folder}${job.out_dirs.map(d => html`<br key=${d} />↳ ${d}`)}` : job.folder],
      ["File format", isFno ? "CSV, Accelpix layout" : { csv: "CSV", parquet: "Parquet" }[job.format] || "Parquet"],
      ...(isFno ? [["Zero-volume contracts", job.keep_zero ? "Kept (ON)" : "Skipped (OFF)"],
                   ["Contracts", job.trim_to_bhav ? "Bhavcopy only (ON)" : "Full list (OFF)"]] : []),
      ["Pass", job.pass ? (job.pass > 1 ? `${job.pass} (retrying failed ${isFno ? "contracts" : "chunks"})` : "1") : "Not started"],
    ] : [];
    const current = rates.length ? rates[rates.length - 1] : 0;
    const ticker = running ? (job.symbol || "Preparing") : job.state === "idle" ? "Ready" : job.state === "finished" ? "All done" : "Paused";
    const sub = running && job.symbol ? `${isFno ? `1-minute candles for ${long(parse(job.fno_date))}` : `Window from ${long(parse(job.chunk))}`}${job.pass > 1 ? `, retry pass ${job.pass}` : ""}`
              : job.run ? (isFno ? fnoRun : `${what} candles, ${long(parse(job.from))} to ${long(parse(job.to))}`) : "Start a download to see live progress here.";
    const msgWarn = job.state === "stopped" || (job.state === "finished" && job.failed > 0);

    return html`<section className="card panel" aria-labelledby="live-title">
      <div className="card-title"><h2 id="live-title">Live progress</h2>
        <span className=${"badge " + job.state}><i></i>${badge}</span></div>

      <div className="live-top">
        <${Ring} pct=${pct} state=${job.state} failed=${job.failed} />
        <div>
          <div className="now-label">${running && job.symbol ? (job.part || "Now fetching") : "Status"}</div>
          <div key=${job.symbol} className=${"ticker" + (running ? " flash" : "")}>${ticker}</div>
          <div className="now-sub">${sub}</div>
          ${running && job.eta && html`<div className="eta"><b>${job.eta}</b><small>remaining</small></div>`}
        </div>
      </div>

      ${job.message && html`<div className=${"message" + (msgWarn ? " warn" : "")}>${job.message}</div>`}

      <div className="spark">
        <div className="spark-head"><span>Throughput</span><b>${running ? current.toFixed(2) : "0.00"} req/s
          <span style=${{ color: "var(--dim)", fontWeight: 500 }}>, limit ${job.speed}</span></b></div>
        <${Spark} points=${rates} />
      </div>

      <div className="tiles">
        ${tiles.map(([k, v, cls, sub]) => html`<div key=${k} className=${"tile " + (cls || "")}><small>${k}</small><b>${v}</b>${sub ? html`<small>${sub}</small>` : ""}</div>`)}
      </div>

      ${details.length > 0 && html`<dl className="details">${details.map(([k, v]) => html`<div key=${k}><dt>${k}</dt><dd>${v}</dd></div>`)}</dl>`}
      ${isFno && !running && (job.fno_summary || []).length > 0 && html`<${FnoSummary} rows=${job.fno_summary} futures=${job.fno_futures || []}
                                                                              broker=${job.source === "dhan" ? "Dhan" : "Kite"} />`}
      ${job.filter_info && html`<p className="filter">Selected: ${job.filter_info}</p>`}
      ${running && html`<div style=${{ marginTop: 18 }}><button type="button" className="btn btn-danger btn-block" disabled=${stopping} onClick=${stop}>
        ${stopping ? html`<span className="spinner"></span> Stopping` : "Stop download"}</button></div>`}
    </section>`;
  }

  // summary.csv rows and the futures stats from build_summary() in backfill/fno.py
  function FnoSummary({ rows, futures, broker = "Kite" }) {
    const num = v => v === "" || v == null ? "" : n(v);
    const checked = rows.some(r => r.Bhav_traded_contracts !== "" && r.Bhav_traded_contracts != null);
    const bad = v => Number(v) > 0 ? { color: "var(--amber)" } : null;
    return html`<div className="sum">
      <div className="sum-title">By expiry (summary.csv)</div>
      <div className="table-wrap"><table>
        <thead><tr><th>Expiry</th><th>Bucket</th><th className="num" title=${`Strikes listed by ${broker}`}>Listed</th><th className="num" title="Strikes with at least one file">Traded</th><th className="num">CE</th><th className="num">PE</th>
          <th className="num">ATM</th><th className="num">ATM bars, CE / PE</th>
          ${checked && html`<th className="num" title="Contracts traded in the bhavcopy">Bhav traded</th><th className="num">${broker} files</th>
            <th className="num">Missing</th><th className="num">Extra</th><th className="num">OI diffs</th><th className="num">Price diffs</th>`}</tr></thead>
        <tbody>${rows.map(r => html`<tr key=${r.Expiry + r.Bucket}><td>${long(parse(r.Expiry))}</td><td>${r.Bucket}</td>
          <td className="num">${num(r.Listed_strikes)}</td><td className="num">${num(r.Traded_strikes)}</td><td className="num">${num(r.CE_files)}</td><td className="num">${num(r.PE_files)}</td>
          <td className="num">${num(r.ATM_strike)}</td><td className="num">${r.Bucket.startsWith("Futures") ? "" : `${r.ATM_CE_bars === "" ? "None" : r.ATM_CE_bars} / ${r.ATM_PE_bars === "" ? "None" : r.ATM_PE_bars}`}</td>
          ${checked && html`<td className="num">${num(r.Bhav_traded_contracts)}</td><td className="num">${num(r.Kite_files)}</td>
            <td className="num" style=${bad(r.Missing_in_kite)}>${num(r.Missing_in_kite)}</td><td className="num" style=${bad(r.Extra_in_kite)}>${num(r.Extra_in_kite)}</td>
            <td className="num" style=${bad(r.OI_diffs)}>${num(r.OI_diffs)}</td><td className="num" style=${bad(r.Price_diffs)}>${num(r.Price_diffs)}</td>`}</tr>`)}</tbody>
      </table></div>
      ${futures.length > 0 && html`<div className="sum-title">Futures, 09:15 to 15:30</div>
      <div className="table-wrap"><table>
