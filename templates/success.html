        <thead><tr><th>Future</th><th className="num">Bars</th><th className="num">Open</th><th className="num">High</th><th className="num">Low</th>
          <th className="num">Close</th><th className="num">Volume</th><th className="num">Last OI</th></tr></thead>
        <tbody>${futures.map(r => html`<tr key=${r.Future}><td>${r.Future}</td><td className="num">${num(r.Bars)}</td>
          <td className="num">${r.Open}</td><td className="num">${r.High}</td><td className="num">${r.Low}</td><td className="num">${r.Close}</td>
          <td className="num">${num(r.Volume)}</td><td className="num">${num(r.Last_OI)}</td></tr>`)}</tbody>
      </table></div>`}
    </div>`;
  }

  function Feed({ items, running, fno }) {
    return html`<section className="card panel" aria-labelledby="feed-title">
      <div className="card-title"><h2 id="feed-title">Recently completed</h2><span>${items.length ? `${n(items.length)} done, newest first` : "This job"}</span></div>
      ${items.length ? html`<ul className="feed">${items.map(it => html`<li key=${it.symbol}>
          <span><span className="tick">✓</span><b>${it.symbol}</b></span>
          <small>${new Date(it.t).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", second: "2-digit" })}</small></li>`)}</ul>`
        : html`<div className="empty">${running ? (fno ? "Contracts appear here as their files are saved." : "Stocks and indices appear here as they finish.") : "Nothing downloaded in this job yet."}</div>`}
    </section>`;
  }

  function UserMenu() {
    const [open, setOpen] = useState(false);
    const u = boot.user;
    const initials = (u.user_name || u.user_id || "?").split(/\s+/).map(s => s[0]).slice(0, 2).join("").toUpperCase();
    useEffect(() => {
      if (!open) return;
      const close = e => { if (!e.target.closest(".user")) setOpen(false); };
      const esc = e => e.key === "Escape" && setOpen(false);
      document.addEventListener("click", close); document.addEventListener("keydown", esc);
      return () => { document.removeEventListener("click", close); document.removeEventListener("keydown", esc); };
    }, [open]);
    return html`<div className="user">
      <button type="button" className="user-btn" aria-expanded=${open} aria-label="Account" onClick=${() => setOpen(o => !o)}>
        <span className="avatar">${initials}</span>
        <span className="name"><b>${u.user_name}</b> <small>${u.user_id}</small></span></button>
      ${open && html`<div className="menu panel">
        <dl><dt>Email</dt><dd>${u.email}</dd><dt>Broker</dt><dd>${u.broker}</dd><dt>Signed in</dt><dd>${u.login_time}</dd></dl>
        <p>Kite sessions end every day. Sign in again and resume a stopped download with the same dates and folder.</p>
        <a className="btn btn-ghost btn-block" href=${U.logout}>Log out</a>
        <div className="menu-dhan">
          <dl><dt>Dhan</dt><dd>${boot.dhan.connected
            ? `Connected${boot.dhan.expiry ? ` until ${boot.dhan.expiry}` : ""}` : "Not connected"}</dd></dl>
          ${boot.dhan.connected
            ? html`<a className="btn btn-primary btn-block" href=${U.dhanDashboard} style=${{ marginBottom: 8 }}>Open Dhan F&O</a>
                   <a className="btn btn-ghost btn-block" href=${U.dhanLogout}>Disconnect Dhan</a>`
            : html`<a className="btn btn-ghost btn-block" href=${U.dhan}>Connect Dhan</a>`}</div></div>`}
    </div>`;
  }

  function DhanMenu() {
    const [open, setOpen] = useState(false);
    const d = boot.dhan;
    useEffect(() => {
      if (!open) return;
      const close = e => { if (!e.target.closest(".user")) setOpen(false); };
      const esc = e => e.key === "Escape" && setOpen(false);
      document.addEventListener("click", close); document.addEventListener("keydown", esc);
      return () => { document.removeEventListener("click", close); document.removeEventListener("keydown", esc); };
    }, [open]);
    return html`<div className="user">
      <button type="button" className="user-btn" aria-expanded=${open} aria-label="Dhan account" onClick=${() => setOpen(o => !o)}>
        <span className="avatar">DH</span>
        <span className="name"><b>Dhan</b> <small>${d.client_id}</small></span></button>
      ${open && html`<div className="menu panel">
        <dl><dt>Client ID</dt><dd>${d.client_id}</dd><dt>Valid until</dt><dd>${d.expiry ? `${d.expiry} IST` : "unknown"}</dd>
          ${d.data_plan && html`<dt>Data API</dt><dd>${d.data_plan}</dd>`}</dl>
        <p>Dhan access tokens expire. Paste a new one on the Dhan tab and resume; saved contracts are skipped.</p>
        ${boot.kite && html`<a className="btn btn-ghost btn-block" href=${U.success} style=${{ marginBottom: 8 }}>Kite dashboard</a>`}
        <a className="btn btn-ghost btn-block" href=${U.dhanPageLogout}>Log out of Dhan</a></div>`}
    </div>`;
  }

  function App() {
    const [toasts, toast] = useToasts();
    const [job, setJob] = useState(null);
    const [rates, setRates] = useState([]);
    const [feed, setFeed] = useState([]);
    const [folder, setFolder] = useState(boot.form.folder);
    const [fnoFolder, setFnoFolder] = useState(boot.fno.folder || boot.form.folder);   // F&O and bhavcopy cards (.env FNO_RAW_*), separate from New download
    const [keepZero, setKeepZero] = useState(!!boot.fno.keep_zero_volume);   // default from config.keep_zero_volume()
    const [trimBhav, setTrimBhav] = useState(!!boot.fno.trim_to_bhav);       // default from config.trim_to_bhav()
    // NIFTY | SENSEX on the F&O and bhavcopy cards; remembered in this browser
    const [und, setUndState] = useState(() => {
      let v = "";
      try { v = localStorage.getItem("fno-underlying") || ""; } catch (e) {}
      return UNDERLYINGS.some(u => u.name === v) ? v : boot.fno.underlying;
    });
    Q.underlying = und;
    const setUnd = v => { Q.underlying = v; setUndState(v); try { localStorage.setItem("fno-underlying", v); } catch (e) {} };
    const [bhav, setBhav] = useState({ days: [], banners: { check: [], minor: [], pending_old: [] } });
    const [openDay, setOpenDay] = useState("");
    const [checkingAll, setCheckingAll] = useState(false);
    const last = useRef(null);
    const seen = useRef({ job: -1, count: 0 });

    const poll = useCallback(async () => {
      try {
        const get = since => fetch(`${U.status}?since=${since}`, { cache: "no-store" }).then(r => r.json());
        const s = seen.current;
        let j = await get(s.count);
        if (j.job_no !== s.job && s.count) j = await get(0);   // a new job: fetch its list from the start
        const fresh = j.job_no !== s.job;
        seen.current = { job: j.job_no, count: j.completed_count };
        const add = j.completed_new.map(([symbol, t]) => ({ symbol, t })).reverse();
        if (fresh || add.length) setFeed(fs => {
          const base = fresh ? [] : fs, have = new Set(base.map(f => f.symbol));
          return [...add.filter(f => !have.has(f.symbol)), ...base];
        });
        const now = performance.now(), prev = last.current;
        if (prev && j.state === "running") {
          if (j.requests >= prev.requests && now > prev.t)
            setRates(rs => [...rs, (j.requests - prev.requests) / ((now - prev.t) / 1000)].slice(-60));
        }
        last.current = { ...j, t: now };
        setJob(j);
        document.title = j.state === "running" && j.chunks_total
          ? `${(j.chunks_done / j.chunks_total * 100).toFixed(0)}% | Kite Backfill` : "Kite Backfill";
        return j;
      } catch (e) { return null; }
    }, []);

    useEffect(() => { poll(); const t = setInterval(poll, 2000); return () => clearInterval(t); }, [poll]);

    // Bhavcopy check of every saved Kite day in the F&O folder (backfill/bhav.py list_days / banners)
    const loadBhav = useCallback(async () => {
      if (!FULL_PATH.test(fnoFolder.trim())) { setBhav({ days: [], banners: { check: [], minor: [], pending_old: [] } }); return; }
      try {
        const j = await (await fetch(`${U.bhavStatus}?${new URLSearchParams({ folder: fnoFolder, ...Q })}`, { cache: "no-store" })).json();
        if (!j.error) setBhav(j);
      } catch (e) {}
    }, [fnoFolder, und]);
    useEffect(() => { setOpenDay(""); setBhav({ days: [], banners: { check: [], minor: [], pending_old: [] } }); }, [und]);
    useEffect(() => { const t = setTimeout(loadBhav, 600); return () => clearTimeout(t); }, [loadBhav]);
    const jobRunning = !!job && job.state === "running";
    useEffect(() => { if (job && !jobRunning) loadBhav(); }, [jobRunning]);
    const checkAll = async () => {
      setCheckingAll(true);
      await bhavCheck({ folder: fnoFolder, missing: "1" }, toast);
      await loadBhav(); poll();
      setCheckingAll(false);
    };
    const showDay = d => { setOpenDay(d); setTimeout(() => document.getElementById("bhav-title")?.scrollIntoView({ behavior: "smooth", block: "start" }), 50); };
    useEffect(() => { if (boot.error) toast(boot.error, "err"); else if (boot.dhan_connected) toast("Dhan connected", "ok"); }, []);

    const hour = new Date().getHours();
    const hello = hour < 12 ? "Good morning" : hour < 17 ? "Good afternoon" : "Good evening";
    const first = (boot.user.user_name || "").split(" ")[0];

    return html`<div className="shell">
      ${DHAN ? html`<nav className="nav">
          <div className="brand"><${Logo} /> Kite Backfill <span style=${{ color: "var(--muted)", fontWeight: 600 }}>· Dhan</span></div>
          <div className="nav-actions"><${DhanMenu} />
            <a className="btn btn-ghost" href=${U.dhanPageLogout} title="Removes the Dhan token from .env; a running download continues until it ends or is stopped">Log out</a></div></nav>
        <header className="heading">
          <h1>Dhan ${und} F&O</h1>
          <p>Save one day's 1-minute candles with open interest for every live ${und} future and option, weekly and monthly expiries, from your Dhan account, and check each day against ${exchOf(und)}'s bhavcopy. Progress is saved as you go, so you can stop and resume any time.</p>
        </header>`
      : html`<nav className="nav"><div className="brand"><${Logo} /> Kite Backfill</div><${UserMenu} /></nav>
        <header className="heading">
          <h1>${hello}${first ? `, ${first}` : ""}</h1>
          <p>Download historical candles for every NSE stock and the main NSE indices, and save each day's ${UNDERLYINGS.map(u => u.name).join(" and ")} F&O contracts before they expire. Progress is saved as you go, so you can stop and resume any time.</p>
        </header>`}
      ${bhav.banners.check.length > 0 && html`<div className="banner bad" role="alert">
        <span>Bhavcopy check found differences on ${bhav.banners.check.map(d => short(parse(d))).join(", ")}.</span>
        <button type="button" className="btn btn-ghost" onClick=${() => showDay(bhav.banners.check[0])}>Show</button></div>`}
      ${(bhav.banners.minor || []).length > 0 && html`<div className="banner minor">
        <span>Minor bhavcopy differences (known ${DHAN ? "data-feed" : "Kite"} limitations: zero-volume, extra files, OI, price) on ${bhav.banners.minor.map(d => short(parse(d))).join(", ")}.</span>
        <button type="button" className="btn btn-ghost" onClick=${() => showDay(bhav.banners.minor[0])}>Show</button></div>`}
      ${bhav.banners.pending_old.length > 0 && html`<div className="banner warn">
        <span>${bhav.banners.pending_old.length} ${bhav.banners.pending_old.length === 1 ? "day" : "days"} not checked against the bhavcopy.</span>
        <button type="button" className="btn btn-ghost" disabled=${checkingAll || jobRunning} onClick=${checkAll}>
          ${checkingAll ? html`<span className="spinner"></span> Checking` : "Check all pending"}</button></div>`}
      <div className="grid">
        <div>
          ${!DHAN && html`<${Planner} job=${job} toast=${toast} onPoll=${poll} folder=${folder} setFolder=${setFolder} />`}
          <${FnoCard} job=${job} toast=${toast} onPoll=${poll} folder=${fnoFolder} setFolder=${setFnoFolder} days=${bhav.days} onBhav=${loadBhav}
                     keepZero=${keepZero} setKeepZero=${setKeepZero} trimBhav=${trimBhav} setTrimBhav=${setTrimBhav}
                     und=${und} setUnd=${setUnd} />
        </div>
        <div>
          <${Live} job=${job} rates=${rates} toast=${toast} onPoll=${poll} />
          <${Feed} items=${feed} running=${!!job && job.state === "running"} fno=${!!job && job.kind === "fno"} />
        </div>
      </div>
      <div className="full-row">
        <${BhavCard} job=${job} toast=${toast} onPoll=${poll} folder=${fnoFolder} days=${bhav.days} onBhav=${loadBhav}
                     openDay=${openDay} setOpenDay=${setOpenDay} checkAll=${checkAll} checkingAll=${checkingAll} keepZero=${keepZero} und=${und} />
      </div>
      <${Toasts} items=${toasts} />
    </div>`;
  }

  ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();
{% endraw %}</script>
{% endblock %}
