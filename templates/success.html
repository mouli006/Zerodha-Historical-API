{% extends "base.html" %}
{% block title %}Kite Backfill{% endblock %}
{% block head %}
<style>
  .shell { max-width: 1280px; margin: 0 auto; padding: 0 24px 64px; }
  .nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 0 28px; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 18px; letter-spacing: -.01em; }
  .user { position: relative; }
  .user-btn { display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 6px; border-radius: 999px; cursor: pointer;
              background: rgba(148,163,184,.08); border: 1px solid var(--border); }
  .user-btn:hover { border-color: var(--border-2); }
  .avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px;
            background: var(--grad); color: #071021; }
  .user-btn small { color: var(--muted); font-size: 12px; }
  .menu { position: absolute; right: 0; top: calc(100% + 10px); width: 280px; padding: 16px; z-index: 20; }
  .menu dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0 0 14px; font-size: 13px; }
  .menu dt { color: var(--muted); }
  .menu dd { margin: 0; overflow-wrap: anywhere; }
  .menu p { color: var(--muted); font-size: 12px; margin: 0 0 14px; }

  .heading { margin: 0 0 24px; }
  .heading h1 { margin: 0 0 4px; font-size: clamp(28px, 3.4vw, 38px); letter-spacing: -.03em; font-weight: 800; line-height: 1.15; }
  .heading p { margin: 0; color: var(--muted); }

  .grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
  .card { padding: 26px; }
  .card + .card { margin-top: 24px; }
  .card-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 22px; }
  .card-title h2 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
  .card-title > span { color: var(--muted); font-size: 13px; }

  .section { margin-bottom: 22px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .segmented { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 14px; background: rgba(7,11,22,.55);
               border: 1px solid var(--border-2); position: relative; }
  .segmented button { position: relative; z-index: 1; border: 0; background: none; padding: 11px 12px; border-radius: 10px;
                      cursor: pointer; font-weight: 700; color: var(--muted); transition: color .2s; }
  .segmented button:disabled { cursor: not-allowed; }
  .segmented button small { display: block; font-weight: 500; font-size: 12px; color: var(--dim); }
  .segmented button[aria-pressed="true"] { color: #071021; }
  .segmented button[aria-pressed="true"] small { color: rgba(7,16,33,.65); }
  .segmented .thumb { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 10px;
                      background: var(--grad); transition: transform .3s cubic-bezier(.3,.8,.3,1); }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .chip { border: 1px solid var(--border-2); background: rgba(148,163,184,.06); border-radius: 999px; padding: 6px 12px;
          font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer; }
  .chip:hover:not(:disabled) { color: var(--text); border-color: var(--indigo); }
  .chip.on { color: var(--text); border-color: var(--indigo); background: rgba(124,131,255,.16); }
  .chip:disabled { opacity: .5; cursor: not-allowed; }

  .slider-head { display: flex; justify-content: space-between; align-items: baseline; }
  .slider-head b { font-size: 15px; }
  input[type=range] { width: 100%; appearance: none; -webkit-appearance: none; height: 6px; border-radius: 6px; margin: 14px 0 8px;
                      background: linear-gradient(90deg, var(--indigo), var(--cyan)) 0 / var(--fill, 50%) 100% no-repeat, rgba(148,163,184,.18); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #fff;
                      box-shadow: 0 0 0 5px rgba(124,131,255,.3); cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border: 0; border-radius: 50%; background: #fff;
                      box-shadow: 0 0 0 5px rgba(124,131,255,.3); cursor: pointer; }
  input[type=range]:disabled { opacity: .5; }
  .scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); }

  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0;
            border-top: 1px solid var(--border); cursor: pointer; }
  .toggle:last-child { border-bottom: 1px solid var(--border); }
  .toggle b { display: block; font-size: 14px; }
  .toggle small { color: var(--muted); font-size: 12px; }
  .switch { position: relative; flex: none; width: 44px; height: 26px; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .switch span { position: absolute; inset: 0; border-radius: 999px; background: rgba(148,163,184,.22); transition: background .2s; pointer-events: none; }
  .switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%;
                        background: #fff; transition: transform .25s cubic-bezier(.3,.8,.3,1); }
  .switch input:checked + span { background: var(--grad); }
  .switch input:checked + span::after { transform: translateX(18px); }
  .switch input:focus-visible + span { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .switch input:disabled + span { opacity: .5; }

  .folder { display: flex; gap: 8px; }
  .folder .input { flex: 1; min-width: 0; }
  .hint { color: var(--dim); font-size: 12px; margin-top: 8px; }

  .estimate { border-radius: 16px; padding: 18px; background: linear-gradient(135deg, rgba(124,131,255,.12), rgba(56,217,245,.06));
              border: 1px solid rgba(124,131,255,.28); margin-bottom: 18px; }
  .est-nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
  .est-nums small { display: block; color: var(--muted); font-size: 12px; }
  .est-nums b { font-size: 22px; letter-spacing: -.02em; }
  .windows { display: flex; gap: 4px; height: 30px; }
  .win { flex: var(--d) 1 0; min-width: 0; border-radius: 6px; background: rgba(124,131,255,.18); font-size: 11px; font-weight: 700;
         color: var(--muted); padding: 7px 6px; white-space: nowrap; overflow: hidden; transition: background .3s, color .3s; }
  .win.now { background: var(--grad); color: #071021; box-shadow: 0 0 20px rgba(56,217,245,.45); }
  .win-ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); margin-top: 6px; }
  .est-note { font-size: 13px; color: var(--muted); margin: 12px 0 0; }
  .problem { display: flex; gap: 10px; padding: 12px 14px; border-radius: 12px; margin-bottom: 16px; font-size: 14px;
             background: rgba(255, 92, 122, .1); border: 1px solid rgba(255, 92, 122, .35); color: #FFB3C1; }
  .actions { display: flex; gap: 12px; }
  .actions .btn-primary { flex: 1; }

  /* Live panel */
  .badge { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 800; }
  .badge i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .badge.running { color: var(--green); background: rgba(46,229,157,.12); }
  .badge.running i { animation: pulse 1.6s ease-out infinite; }
  .badge.stopped { color: var(--amber); background: rgba(255,181,71,.12); }
  .badge.finished { color: var(--green); background: rgba(46,229,157,.12); }
  .badge.idle { color: var(--muted); background: rgba(148,163,184,.12); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(46,229,157,.6); } 100% { box-shadow: 0 0 0 10px rgba(46,229,157,0); } }

  .live-top { display: grid; grid-template-columns: 200px 1fr; gap: 24px; align-items: center; margin-bottom: 22px; }
  .ring { position: relative; width: 200px; height: 200px; }
  .ring svg { transform: rotate(-90deg); display: block; }
  .ring circle { transition: stroke-dashoffset .8s cubic-bezier(.3,.8,.3,1); }
  .ring-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring-center b { font-size: 40px; letter-spacing: -.04em; line-height: 1; }
  .ring-center b sup { font-size: 18px; color: var(--muted); }
  .ring-center small { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .now-label { color: var(--muted); font-size: 12px; font-weight: 600; }
  .ticker { font-size: 28px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; overflow-wrap: anywhere; }
  .ticker.flash { animation: flash .5s ease-out; }
  @keyframes flash { from { color: var(--cyan); transform: translateY(-3px); } }
  .now-sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .eta { display: inline-flex; gap: 8px; align-items: baseline; padding: 8px 12px; border-radius: 10px; background: rgba(148,163,184,.08); }
  .eta b { font-size: 16px; }
  .eta small { color: var(--muted); font-size: 12px; }

  .spark { border-radius: 14px; padding: 14px 16px 10px; background: rgba(7,11,22,.45); border: 1px solid var(--border); margin-bottom: 18px; }
  .spark-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .spark-head b { color: var(--text); font-size: 14px; }
  .spark svg { display: block; width: 100%; height: 64px; margin-top: 6px; }

  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
  .tile { padding: 12px 14px; border-radius: 14px; background: rgba(148,163,184,.06); border: 1px solid var(--border); }
  .tile small { display: block; color: var(--muted); font-size: 12px; }
  .tile b { font-size: 19px; letter-spacing: -.01em; }
  .tile.bad { border-color: rgba(255,92,122,.4); background: rgba(255,92,122,.08); }
  .tile.bad b { color: var(--red); }
  .tile.warn b { color: var(--amber); }
  .message { padding: 12px 14px; border-radius: 12px; font-size: 14px; background: rgba(148,163,184,.08); border: 1px solid var(--border); margin-bottom: 18px; }
  .message.warn { background: rgba(255,181,71,.08); border-color: rgba(255,181,71,.35); color: #FFD59A; }
  .filter { color: var(--dim); font-size: 12px; margin: 0; }
  .details { margin: 0 0 14px; font-size: 13px; }
  .details div { display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding: 8px 0; border-top: 1px solid var(--border); }
  .details div:last-child { border-bottom: 1px solid var(--border); }
  .details dt { color: var(--muted); }
  .details dd { margin: 0; overflow-wrap: anywhere; }

  .feed { list-style: none; margin: 0; padding: 0 6px 0 0; max-height: 420px; overflow-y: auto; }
  .feed li { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid var(--border); font-size: 14px; }
  .feed li:first-child { border-top: 0; animation: toast-in .35s ease-out; }
  .feed .tick { color: var(--green); margin-right: 10px; }
  .feed small { color: var(--dim); font-size: 12px; }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 18px 0 6px; display: grid; place-items: center; }

  @media (max-width: 1060px) { .grid { grid-template-columns: 1fr; } }
  @media (max-width: 560px) {
    .shell { padding: 0 16px 48px; }
    .card { padding: 20px 18px; }
    .row2 { grid-template-columns: 1fr; }
    .live-top { grid-template-columns: 1fr; justify-items: center; text-align: center; }
    .tiles { grid-template-columns: repeat(2, 1fr); }
    .est-nums b { font-size: 18px; }
    .user-btn .name { display: none; }
    .user-btn { padding: 4px; }
    .folder { flex-direction: column; }
  }
</style>
{% endblock %}
{% block body %}
<script id="boot" type="application/json">{{ {
  "user": user, "form": form, "today": today, "error": error or "",
  "urls": {"start": url_for("dashboard.download_start"), "stop": url_for("dashboard.download_stop"), "status": url_for("dashboard.download_status"),
           "browse": url_for("dashboard.browse_folder"), "logout": url_for("auth.logout"), "success": url_for("dashboard.success")}
}|tojson }}</script>
<script>{% raw %}
(() => {
  const { useState, useEffect, useRef, useMemo, useCallback } = React;
  const boot = JSON.parse(document.getElementById("boot").textContent);
  const U = boot.urls;
  const WINDOW_DAYS = { minute: 60, day: 2000 };
  const TYPICAL_STOCKS = 2150;

  const nf = new Intl.NumberFormat("en-IN");
  const n = v => nf.format(Math.round(Number(v) || 0));
  const parse = s => { const d = new Date(s + "T00:00:00"); return isNaN(d) ? null : d; };
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const short = d => d.toLocaleDateString("en-IN", { day: "numeric", month: "short" });
  const long = d => d ? d.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }) : "";
  const dur = s => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.round(s % 3600 / 60);
                     return h ? `${h}h ${String(m).padStart(2, "0")}m` : `${Math.max(m, 1)} min`; };
  const addDays = (d, k) => { const x = new Date(d); x.setDate(x.getDate() + k); return x; };

  // Same windows as make_chunks() in backfill/fetch.py
  function windows(from, to, interval) {
    const out = [], step = WINDOW_DAYS[interval] || 60;
    for (let cur = new Date(from); cur <= to;) {
      const end = addDays(cur, step - 1), last = end < to ? end : new Date(to);
      out.push({ from: new Date(cur), days: Math.round((last - cur) / 864e5) + 1 });
      cur = addDays(last, 1);
    }
    return out;
  }

  // Same checks as download_start() in dashboard.py
  function problem(f) {
    const from = parse(f.from), to = parse(f.to), speed = Number(f.speed);
    if (!from || !to) return "Enter a start and end date.";
    if (to > parse(boot.today)) return "The end date can't be in the future.";
    if (from >= to) return "The start date must be before the end date.";
    if ((to - from) / 864e5 > 365) return "Choose a range of one year or less. Split longer periods into separate downloads.";
    if (!(speed > 0 && speed <= 3)) return "Set a speed between 0.1 and 3 requests a second.";
    if (!/^([a-zA-Z]:[\\/]|\\\\|\/|~)/.test(f.folder.trim())) return "Enter the folder as a full path, for example D:\\market_data.";
    return "";
  }

  const PRESETS = [["30 days", 30], ["3 months", 91], ["6 months", 182], ["1 year", 364]];

  function Planner({ job, toast, onPoll }) {
    const [f, setF] = useState({ ...boot.form, speed: Number(boot.form.speed) });
    const [busy, setBusy] = useState("");
    const set = (k, v) => setF(x => ({ ...x, [k]: v }));
    const running = !!job && job.state === "running";
    const err = problem(f);
    const from = parse(f.from), to = parse(f.to);
    const ws = useMemo(() => err ? [] : windows(from, to, f.interval), [f.from, f.to, f.interval, err]);
    const stocks = (job && job.stocks_total) || TYPICAL_STOCKS;
    const total = stocks * ws.length;
    const runKey = `${f.interval}:${f.from}:${f.to}${f.format === "parquet" ? "" : ":" + f.format}`;   // run_key() in backfill/storage.py
    const sameRun = !!job && job.run === runKey && !!job.folder &&
                    job.folder.toLowerCase() === f.folder.trim().toLowerCase() && job.chunks_total > 0;
    const left = sameRun ? job.chunks_total - job.chunks_done : total;
    const resumable = !running && sameRun && job.chunks_done > 0 && left > 0;
    const preset = PRESETS.find(([, d]) => f.to === boot.today && f.from === iso(addDays(parse(boot.today), -d)));

    const start = async () => {
      setBusy("start");
      const body = new FormData();
      Object.entries({ interval: f.interval, from: f.from, to: f.to, speed: f.speed, folder: f.folder, format: f.format }).forEach(([k, v]) => body.append(k, v));
      if (f.etfs) body.append("etfs", "1");
      if (f.t2t) body.append("t2t", "1");
      try {
        const r = await fetch(U.start, { method: "POST", body });
        const u = new URL(r.url);
        if (u.pathname !== U.success) { location.href = r.url; return; }   // session ended: back to sign-in
        const e = u.searchParams.get("error");
        e ? toast(e, "err") : toast(resumable ? "Download resumed" : "Download started", "ok");
      } catch (e) { toast("Couldn't reach the app. Check that python app.py is running.", "err"); }
      setBusy(""); onPoll();
    };

    const browse = async () => {
      setBusy("browse");
      try {
        const j = await (await fetch(U.browse, { method: "POST", body: new URLSearchParams({ current: f.folder }) })).json();
        if (j.path) set("folder", j.path);
        if (j.error) toast(j.error, "err");
      } catch (e) { toast("Couldn't open the folder window. Type the path instead.", "err"); }
      setBusy("");
    };

    const speedPct = (f.speed - .5) / 2.5 * 100;
    return html`<section className="card panel" aria-labelledby="plan-title">
      <div className="card-title"><h2 id="plan-title">New download</h2><span>All NSE equity stocks</span></div>

      <div className="section">
        <span className="label">Candle size</span>
        <div className="segmented" role="group" aria-label="Candle size">
          <span className="thumb" style=${{ transform: f.interval === "day" ? "translateX(100%)" : "none" }}></span>
          <button type="button" aria-pressed=${f.interval === "minute"} disabled=${running} onClick=${() => set("interval", "minute")}>
            1 minute<small>7 requests per stock a year</small></button>
          <button type="button" aria-pressed=${f.interval === "day"} disabled=${running} onClick=${() => set("interval", "day")}>
            Daily (EOD)<small>1 request per stock</small></button>
        </div>
      </div>

      <div className="section">
        <div className="row2">
          <div><label className="label" htmlFor="from">From</label>
            <input className="input" id="from" type="date" max=${boot.today} value=${f.from} disabled=${running} onChange=${e => set("from", e.target.value)} /></div>
          <div><label className="label" htmlFor="to">To</label>
            <input className="input" id="to" type="date" max=${boot.today} value=${f.to} disabled=${running} onChange=${e => set("to", e.target.value)} /></div>
        </div>
        <div className="chips">
          ${PRESETS.map(([label, d]) => html`<button key=${label} type="button" disabled=${running}
              className=${"chip" + (preset && preset[1] === d ? " on" : "")}
              onClick=${() => setF(x => ({ ...x, to: boot.today, from: iso(addDays(parse(boot.today), -d)) }))}>Last ${label}</button>`)}
        </div>
      </div>

      <div className="section">
        <div className="slider-head"><label className="label" htmlFor="speed" style=${{ margin: 0 }}>Speed</label>
          <b>${f.speed.toFixed(1)} requests/s</b></div>
        <input id="speed" type="range" min="0.5" max="3" step="0.1" value=${f.speed} disabled=${running}
               style=${{ "--fill": speedPct + "%" }} onChange=${e => set("speed", Number(e.target.value))} />
        <div className="scale"><span>0.5, gentle</span><span>3, Kite's limit</span></div>
      </div>

      <div className="section">
        <label className="toggle">
          <span><b>Trade-to-trade stocks</b><small>Include the -BE and -BZ series</small></span>
          <span className="switch"><input type="checkbox" checked=${f.t2t} disabled=${running} onChange=${e => set("t2t", e.target.checked)} /><span></span></span>
        </label>
        <label className="toggle">
          <span><b>ETFs</b><small>Index, gold and other ETFs listed on NSE</small></span>
          <span className="switch"><input type="checkbox" checked=${f.etfs} disabled=${running} onChange=${e => set("etfs", e.target.checked)} /><span></span></span>
        </label>
      </div>

      <div className="section">
        <label className="label" htmlFor="folder">Save to</label>
        <div className="folder">
          <input className="input" id="folder" value=${f.folder} disabled=${running} spellCheck="false" onChange=${e => set("folder", e.target.value)} />
          <button type="button" className="btn btn-ghost" disabled=${running || busy === "browse"} onClick=${browse}>
            ${busy === "browse" ? html`<span className="spinner"></span> Opening` : "Browse"}</button>
        </div>
        <div className="hint">Saved as folder / interval / SYMBOL / year.${f.format}. The folder window may open behind the browser.</div>
      </div>

      <div className="section">
        <span className="label">File format</span>
        <div className="segmented" role="group" aria-label="File format">
          <span className="thumb" style=${{ transform: f.format === "parquet" ? "translateX(100%)" : "none" }}></span>
          <button type="button" aria-pressed=${f.format === "csv"} disabled=${running} onClick=${() => set("format", "csv")}>
            CSV<small>Opens in Excel, larger files</small></button>
          <button type="button" aria-pressed=${f.format === "parquet"} disabled=${running} onClick=${() => set("format", "parquet")}>
            Parquet<small>Compact, for pandas and Python</small></button>
        </div>
      </div>

      ${err ? html`<div className="problem" role="alert">${err}</div>` : html`<div className="estimate">
        <div className="est-nums">
          <div><small>Stocks</small><b>${job && job.stocks_total ? "" : "~"}${n(stocks)}</b></div>
          <div><small>${sameRun ? "Requests left" : "Requests"}</small><b>${n(left)}</b></div>
          <div><small>Time at full speed</small><b>${left ? dur(left / f.speed) : "Done"}</b></div>
        </div>
        <div className="windows" aria-hidden="true">
          ${ws.map(w => html`<div key=${iso(w.from)} style=${{ "--d": w.days }}
              className=${"win" + (running && job.chunk === iso(w.from) ? " now" : "")}>${w.days >= 15 ? short(w.from) : ""}</div>`)}
        </div>
        <div className="win-ends"><span>${long(from)}</span><span>${long(to)}</span></div>
        <p className="est-note">${ws.length === 1 ? "One request per stock covers the whole range."
          : `Kite allows 60 days of 1-minute candles per request, so each stock takes ${ws.length} requests.`}${resumable
          ? ` ${n(job.chunks_done)} chunks are already saved in this folder and will be skipped.` : ""}</p>
      </div>`}

      <div className="actions">
        <button type="button" className="btn btn-primary" disabled=${!!err || running || busy === "start"} onClick=${start}>
          ${busy === "start" ? html`<span className="spinner"></span> Starting` : running ? "Download running" : resumable ? "Resume download" : "Start download"}
        </button>
      </div>
    </section>`;
  }

  function Ring({ pct, state, failed }) {
    const r = 86, c = 2 * Math.PI * r;
    const color = pct >= 100 ? "url(#ok)" : state !== "running" && failed ? "#FFB547" : "url(#ring)";
    return html`<div className="ring" role="progressbar" aria-valuenow=${pct.toFixed(1)} aria-valuemin="0" aria-valuemax="100" aria-label="Chunks downloaded">
      <svg width="200" height="200" viewBox="0 0 200 200">
        <defs>
          <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="#7C83FF"/><stop offset="1" stopColor="#38D9F5"/></linearGradient>
          <linearGradient id="ok" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="#2EE59D"/><stop offset="1" stopColor="#38D9F5"/></linearGradient>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <circle cx="100" cy="100" r=${r} fill="none" stroke="rgba(148,163,184,.14)" strokeWidth="12"/>
        ${pct > 0 && html`<circle cx="100" cy="100" r=${r} fill="none" stroke=${color} strokeWidth="12" strokeLinecap="round"
                strokeDasharray=${c} strokeDashoffset=${c * (1 - Math.min(pct, 100) / 100)} filter="url(#glow)"/>`}
      </svg>
      <div className="ring-center"><b>${Math.floor(pct)}<sup>.${Math.floor(pct % 1 * 10)}%</sup></b><small>downloaded</small></div>
    </div>`;
  }

  function Spark({ points }) {
    const W = 300, H = 64, max = Math.max(3, ...points);
    if (points.length < 2) return html`<svg viewBox=${`0 0 ${W} ${H}`} preserveAspectRatio="none"><line x1="0" x2=${W} y1=${H - 2} y2=${H - 2} stroke="rgba(148,163,184,.25)" strokeDasharray="4 4"/></svg>`;
    const xy = points.map((p, i) => [i / (points.length - 1) * W, H - 4 - p / max * (H - 10)]);
    const d = xy.map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
    return html`<svg viewBox=${`0 0 ${W} ${H}`} preserveAspectRatio="none">
      <defs><linearGradient id="sp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor="#38D9F5" stopOpacity=".35"/><stop offset="1" stopColor="#38D9F5" stopOpacity="0"/></linearGradient></defs>
      <path d=${`${d} L${W},${H} L0,${H} Z`} fill="url(#sp)"/>
      <path d=${d} fill="none" stroke="#38D9F5" strokeWidth="2" vectorEffect="non-scaling-stroke"/></svg>`;
  }

  function Live({ job, rates, toast, onPoll }) {
    const [stopping, setStopping] = useState(false);
    if (!job) return html`<section className="card panel"><div className="empty"><span className="spinner"></span></div></section>`;

    const running = job.state === "running";
    const pct = job.chunks_total ? job.chunks_done / job.chunks_total * 100 : 0;
    const badge = { running: "Downloading", stopped: "Stopped", finished: "Finished", idle: "Idle" }[job.state] || job.state;
    const what = { minute: "1-minute", day: "Daily" }[job.interval] || "";
    const stop = async () => {
      setStopping(true);
      try { await fetch(U.stop, { method: "POST" }); toast("Stopping after the current request", "info"); } catch (e) {}
      for (let i = 0; i < 30; i++) { const j = await onPoll(); if (!j || j.state !== "running") break; await new Promise(r => setTimeout(r, 700)); }
      setStopping(false);
    };
    const tiles = [
      ["Stocks done", job.stocks_total ? `${n(job.stocks_done)} / ${n(job.stocks_total)}` : "None yet"],
      ["Chunks", job.chunks_total ? `${n(job.chunks_done)} / ${n(job.chunks_total)}` : "None yet"],
      ["Requests", n(job.requests)],
      ["Speed now", `${Number(job.rate || 0).toFixed(2)} req/s`, running && job.rate < job.speed ? "warn" : ""],
      ["Rate-limit hits", n(job.n429), job.n429 > 0 ? "warn" : ""],
      ["Network errors", n(job.net_errors), job.net_errors > 0 ? "warn" : ""],
      ["Failed chunks", n(job.failed), job.failed > 0 ? "bad" : ""],
      ["Empty chunks", n(job.empty)],
      ["Time left", running && job.eta ? job.eta : "None"],
    ];
    const details = job.run ? [
      ["Run", `${what} candles, ${long(parse(job.from))} to ${long(parse(job.to))}`],
      ["Saving to", job.folder],
      ["File format", { csv: "CSV", parquet: "Parquet" }[job.format] || "Parquet"],
      ["Pass", job.pass ? (job.pass > 1 ? `${job.pass} (retrying failed chunks)` : "1") : "Not started"],
    ] : [];
    const current = rates.length ? rates[rates.length - 1] : 0;
    const ticker = running ? (job.symbol || "Preparing") : job.state === "idle" ? "Ready" : job.state === "finished" ? "All done" : "Paused";
    const sub = running && job.symbol ? `Window from ${long(parse(job.chunk))}${job.pass > 1 ? `, retry pass ${job.pass}` : ""}`
              : job.run ? `${what} candles, ${long(parse(job.from))} to ${long(parse(job.to))}` : "Start a download to see live progress here.";
    const msgWarn = job.state === "stopped" || (job.state === "finished" && job.failed > 0);

    return html`<section className="card panel" aria-labelledby="live-title">
      <div className="card-title"><h2 id="live-title">Live progress</h2>
        <span className=${"badge " + job.state}><i></i>${badge}</span></div>

      <div className="live-top">
        <${Ring} pct=${pct} state=${job.state} failed=${job.failed} />
        <div>
          <div className="now-label">${running && job.symbol ? "Now fetching" : "Status"}</div>
          <div key=${job.symbol} className=${"ticker" + (running ? " flash" : "")}>${ticker}</div>
          <div className="now-sub">${sub}</div>
          ${running && job.eta && html`<div className="eta"><b>${job.eta}</b><small>remaining</small></div>`}
        </div>
      </div>

      ${job.message && html`<div className=${"message" + (msgWarn ? " warn" : "")}>${job.message}</div>`}

      <div className="spark">
        <div className="spark-head"><span>Throughput</span><b>${running ? current.toFixed(2) : "0.00"} req/s
          <span style=${{ color: "var(--dim)", fontWeight: 500 }}>, limit ${job.speed}</span></b></div>
        <${Spark} points=${rates} />
      </div>

      <div className="tiles">
        ${tiles.map(([k, v, cls]) => html`<div key=${k} className=${"tile " + cls}><small>${k}</small><b>${v}</b></div>`)}
      </div>

      ${details.length > 0 && html`<dl className="details">${details.map(([k, v]) => html`<div key=${k}><dt>${k}</dt><dd>${v}</dd></div>`)}</dl>`}
      ${job.filter_info && html`<p className="filter">Stock list: ${job.filter_info}</p>`}
      ${running && html`<div style=${{ marginTop: 18 }}><button type="button" className="btn btn-danger btn-block" disabled=${stopping} onClick=${stop}>
        ${stopping ? html`<span className="spinner"></span> Stopping` : "Stop download"}</button></div>`}
    </section>`;
  }

  function Feed({ items, running }) {
    return html`<section className="card panel" aria-labelledby="feed-title">
      <div className="card-title"><h2 id="feed-title">Recently completed</h2><span>${items.length ? `${n(items.length)} stocks, newest first` : "This job"}</span></div>
      ${items.length ? html`<ul className="feed">${items.map(it => html`<li key=${it.symbol}>
          <span><span className="tick">✓</span><b>${it.symbol}</b></span>
          <small>${new Date(it.t).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", second: "2-digit" })}</small></li>`)}</ul>`
        : html`<div className="empty">${running ? "Stocks appear here as they finish." : "Nothing downloaded in this job yet."}</div>`}
    </section>`;
  }

  function UserMenu() {
    const [open, setOpen] = useState(false);
    const u = boot.user;
    const initials = (u.user_name || u.user_id || "?").split(/\s+/).map(s => s[0]).slice(0, 2).join("").toUpperCase();
    useEffect(() => {
      if (!open) return;
      const close = e => { if (!e.target.closest(".user")) setOpen(false); };
      const esc = e => e.key === "Escape" && setOpen(false);
      document.addEventListener("click", close); document.addEventListener("keydown", esc);
      return () => { document.removeEventListener("click", close); document.removeEventListener("keydown", esc); };
    }, [open]);
    return html`<div className="user">
      <button type="button" className="user-btn" aria-expanded=${open} aria-label="Account" onClick=${() => setOpen(o => !o)}>
        <span className="avatar">${initials}</span>
        <span className="name"><b>${u.user_name}</b> <small>${u.user_id}</small></span></button>
      ${open && html`<div className="menu panel">
        <dl><dt>Email</dt><dd>${u.email}</dd><dt>Broker</dt><dd>${u.broker}</dd><dt>Signed in</dt><dd>${u.login_time}</dd></dl>
        <p>Kite sessions end every day. Sign in again and resume a stopped download with the same dates and folder.</p>
        <a className="btn btn-ghost btn-block" href=${U.logout}>Log out</a></div>`}
    </div>`;
  }

  function App() {
    const [toasts, toast] = useToasts();
    const [job, setJob] = useState(null);
    const [rates, setRates] = useState([]);
    const [feed, setFeed] = useState([]);
    const last = useRef(null);
    const seen = useRef({ job: -1, count: 0 });

    const poll = useCallback(async () => {
      try {
        const get = since => fetch(`${U.status}?since=${since}`, { cache: "no-store" }).then(r => r.json());
        const s = seen.current;
        let j = await get(s.count);
        if (j.job_no !== s.job && s.count) j = await get(0);   // a new job: fetch its list from the start
        const fresh = j.job_no !== s.job;
        seen.current = { job: j.job_no, count: j.completed_count };
        const add = j.completed_new.map(([symbol, t]) => ({ symbol, t })).reverse();
        if (fresh || add.length) setFeed(fs => {
          const base = fresh ? [] : fs, have = new Set(base.map(f => f.symbol));
          return [...add.filter(f => !have.has(f.symbol)), ...base];
        });
        const now = performance.now(), prev = last.current;
        if (prev && j.state === "running") {
          if (j.requests >= prev.requests && now > prev.t)
            setRates(rs => [...rs, (j.requests - prev.requests) / ((now - prev.t) / 1000)].slice(-60));
        }
        last.current = { ...j, t: now };
        setJob(j);
        document.title = j.state === "running" && j.chunks_total
          ? `${(j.chunks_done / j.chunks_total * 100).toFixed(0)}% | Kite Backfill` : "Kite Backfill";
        return j;
      } catch (e) { return null; }
    }, []);

    useEffect(() => { poll(); const t = setInterval(poll, 2000); return () => clearInterval(t); }, [poll]);
    useEffect(() => { if (boot.error) toast(boot.error, "err"); }, []);

    const hour = new Date().getHours();
    const hello = hour < 12 ? "Good morning" : hour < 17 ? "Good afternoon" : "Good evening";
    const first = (boot.user.user_name || "").split(" ")[0];

    return html`<div className="shell">
      <nav className="nav"><div className="brand"><${Logo} /> Kite Backfill</div><${UserMenu} /></nav>
      <header className="heading">
        <h1>${hello}${first ? `, ${first}` : ""}</h1>
        <p>Download historical candles for every NSE stock. Progress is saved after each chunk, so you can stop and resume any time.</p>
      </header>
      <div className="grid">
        <${Planner} job=${job} toast=${toast} onPoll=${poll} />
        <div>
          <${Live} job=${job} rates=${rates} toast=${toast} onPoll=${poll} />
          <${Feed} items=${feed} running=${!!job && job.state === "running"} />
        </div>
      </div>
      <${Toasts} items=${toasts} />
    </div>`;
  }

  ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();
{% endraw %}</script>
