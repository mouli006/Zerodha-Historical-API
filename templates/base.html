<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kite Backfill{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
  <style>
    :root {
      --bg: #070B16; --bg-2: #0C1326; --panel: rgba(16, 23, 44, .72); --panel-2: rgba(24, 33, 60, .7);
      --border: rgba(148, 163, 184, .13); --border-2: rgba(148, 163, 184, .24);
      --text: #E7EBF7; --muted: #8E99B6; --dim: #5D6886;
      --indigo: #7C83FF; --cyan: #38D9F5; --green: #2EE59D; --red: #FF5C7A; --amber: #FFB547;
      --grad: linear-gradient(135deg, #7C83FF 0%, #38D9F5 100%);
      --radius: 20px; --radius-sm: 12px;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: "Manrope", system-ui, "Segoe UI", sans-serif; font-size: 15px; line-height: 1.55;
      font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
    }
    /* Aurora + faint grid behind everything */
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
      background:
        radial-gradient(900px 600px at 8% -10%, rgba(124, 131, 255, .22), transparent 60%),
        radial-gradient(800px 500px at 100% 0%, rgba(56, 217, 245, .16), transparent 60%),
        radial-gradient(700px 500px at 50% 110%, rgba(46, 229, 157, .08), transparent 60%);
    }
    body::after {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background-image: linear-gradient(rgba(148,163,184,.05) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(148,163,184,.05) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at 50% 0%, #000 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at 50% 0%, #000 30%, transparent 75%);
    }
    a { color: var(--cyan); }
    :focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; border-radius: 6px; }
    button { font: inherit; color: inherit; }

    .panel {
      background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
      backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%);
      box-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 30px 80px -30px rgba(0,0,0,.7);
    }
    .grad-text { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; cursor: pointer;
           border-radius: 12px; padding: 13px 22px; font-weight: 700; font-size: 15px; text-decoration: none;
           transition: transform .15s, box-shadow .2s, opacity .2s, background .2s; white-space: nowrap; }
    .btn:active:not(:disabled) { transform: translateY(1px) scale(.99); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { background: var(--grad); color: #071021; box-shadow: 0 10px 30px -10px rgba(98, 140, 255, .8); }
    .btn-primary:hover:not(:disabled) { box-shadow: 0 14px 40px -10px rgba(98, 160, 255, .95); }
    .btn-ghost { background: rgba(148,163,184,.08); border: 1px solid var(--border-2); color: var(--text); }
    .btn-ghost:hover:not(:disabled) { background: rgba(148,163,184,.14); }
    .btn-danger { background: rgba(255, 92, 122, .12); border: 1px solid rgba(255, 92, 122, .45); color: #FF8FA4; }
    .btn-danger:hover:not(:disabled) { background: rgba(255, 92, 122, .2); }
    .btn-block { width: 100%; }

    /* Inputs */
    .label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
    .input { width: 100%; font: inherit; font-size: 15px; color: var(--text); background: rgba(7, 11, 22, .55);
             border: 1px solid var(--border-2); border-radius: 12px; padding: 12px 14px; transition: border-color .2s, box-shadow .2s; }
    .input::placeholder { color: var(--dim); }
    .input:focus { outline: none; border-color: var(--indigo); box-shadow: 0 0 0 4px rgba(124, 131, 255, .18); }
    .input:disabled { opacity: .6; }

    .spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent;
               animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toasts */
    .toasts { position: fixed; right: 20px; bottom: 20px; display: grid; gap: 10px; z-index: 50; width: min(380px, calc(100vw - 32px)); }
    .toast { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; font-size: 14px;
             background: rgba(16, 23, 44, .92); border: 1px solid var(--border-2); backdrop-filter: blur(12px);
             box-shadow: 0 20px 50px -20px rgba(0,0,0,.8); animation: toast-in .3s ease-out; }
    .toast .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; flex: none; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(10px); } }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <div id="root"></div>
  <noscript><p style="padding:24px">This page needs JavaScript and an internet connection to load React.</p></noscript>
  <script>{% raw %}
    window.html = htm.bind(React.createElement);
    window.Toasts = ({ items }) => html`<div className="toasts" aria-live="polite">
      ${items.map(t => html`<div className="toast" key=${t.id}>
        <span className="dot" style=${{ background: { ok: "var(--green)", err: "var(--red)", info: "var(--cyan)" }[t.kind] }}></span>
        <span>${t.text}</span></div>`)}</div>`;
    window.useToasts = () => {
      const [items, setItems] = React.useState([]);
      const push = React.useCallback((text, kind = "info") => {
        const id = Math.random();
        setItems(xs => [...xs.slice(-3), { id, text, kind }]);
        setTimeout(() => setItems(xs => xs.filter(x => x.id !== id)), 4500);
      }, []);
      return [items, push];
    };
    window.Logo = ({ size = 34 }) => html`<svg width=${size} height=${size} viewBox="0 0 34 34" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="#7C83FF"/><stop offset="1" stopColor="#38D9F5"/></linearGradient></defs>
      <rect width="34" height="34" rx="10" fill="url(#lg)"/>
      <path d="M10 9v16M17 6v22M24 11v13" stroke="#071021" strokeWidth="1.6" strokeLinecap="round"/>
      <rect x="7.5" y="12" width="5" height="9" rx="1.2" fill="#071021"/>
      <rect x="14.5" y="10" width="5" height="12" rx="1.2" fill="#071021" opacity=".55"/>
      <rect x="21.5" y="14" width="5" height="7" rx="1.2" fill="#071021"/></svg>`;
  {% endraw %}</script>
  {% block body %}{% endblock %}
</body>
</html>
